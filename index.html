<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>CG Dulces · Panel del negocio</title>

<!-- PWA / instalable -->
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#6B2D5C" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="CG Dulces" />
<link id="apple-icon" rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
<link id="favicon" rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png" />

<script src="https://cdn.tailwindcss.com"></script>
<script src="js/app/tema.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<link rel="stylesheet" href="css/sistema.css" />
</head>
<body class="w-full flex items-center justify-center p-0 sm:p-4 lg:p-0">

<!-- Pantalla de login -->
<div id="login-screen" class="relative w-full max-w-[460px] md:max-w-none lg:max-w-none h-full sm:max-h-[860px] md:max-h-none lg:max-h-none sm:rounded-[2.25rem] lg:rounded-none sm:shadow-2xl lg:shadow-none sm:border lg:border-0 sm:border-cg-line/5 bg-cg-surface overflow-hidden flex flex-col">
  <div class="flex-1 flex flex-col items-center justify-center px-8">
    <img id="login-logo" src="assets/logo.png" alt="CG Dulces" class="w-[200px] h-auto mb-2" />
    <p class="text-[13px] text-cg-muted mb-8">Ingresá para ver el panel del negocio</p>
    <form id="login-form" class="w-full max-w-[380px] space-y-3">
      <input id="login-email" type="text" required placeholder="Usuario" autocomplete="username"
        class="w-full bg-cg-card rounded-xl px-4 py-3 text-[14px] border border-cg-line/[0.06] outline-none focus:border-cg-primary" />
      <input id="login-password" type="password" required placeholder="Contraseña" autocomplete="current-password"
        class="w-full bg-cg-card rounded-xl px-4 py-3 text-[14px] border border-cg-line/[0.06] outline-none focus:border-cg-primary" />
      <button type="submit" class="w-full bg-cg-primary text-cg-onink text-[14px] font-semibold rounded-xl py-3 active:scale-[0.98] transition-transform">
        Entrar
      </button>
      <p id="login-error" class="hidden text-[12px] text-cg-danger text-center pt-1">Usuario o contraseña incorrectos.</p>
    </form>
  </div>
</div>

<!-- App -->
<div id="app-screen" class="screen-hidden relative w-full max-w-[460px] md:max-w-none lg:max-w-none h-full sm:max-h-[860px] md:max-h-none lg:max-h-none sm:rounded-[2.25rem] lg:rounded-none sm:shadow-2xl lg:shadow-none sm:border lg:border-0 sm:border-cg-line/5 bg-cg-surface overflow-hidden flex flex-col">

  <!-- Encabezado -->
  <div id="app-header" class="px-6 pt-6 pb-4 bg-cg-primary text-cg-onink shrink-0">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <img id="header-logo" src="assets/logo-mark.png" alt="" class="w-[30px] h-auto shrink-0 object-contain" />
        <div>
          <p id="header-nombre" class="font-display text-[22px] font-semibold leading-tight">CG Dulces</p>
          <p class="text-[12px] text-cg-onink/70">Panel del negocio</p>
        </div>
      </div>
      <div class="flex items-center gap-1.5">
        <button onclick="irA('masopciones')" class="text-[11px] font-medium text-cg-onink bg-cg-onink/15 hover:bg-cg-onink/20 rounded-full px-3 py-1.5">Más</button>
        <button id="logout-btn" class="text-[11px] font-medium text-cg-onink/85 hover:text-cg-onink bg-cg-onink/5 hover:bg-cg-onink/15 rounded-full px-3 py-1.5">Salir</button>
      </div>
    </div>
  </div>

  <!-- Contenido -->
  <div id="content" class="flex-1 overflow-y-auto">
    <p class="text-center text-[13px] text-cg-muted pt-10">Cargando...</p>
  </div>

  <!-- Carrito flotante -->
  <div id="cart-bar" class="screen-hidden absolute bottom-[86px] left-4 right-4 bg-cg-ink rounded-2xl px-4 py-3 shadow-xl"></div>

  <!-- Botón flotante agregar producto -->
  <button id="add-product-fab" class="screen-hidden absolute z-30 bottom-[96px] right-4 w-12 h-12 rounded-full bg-cg-primary text-cg-onink text-[22px] shadow-xl items-center justify-center">+</button>

  <!-- Navegación inferior (en PC pasa a ser un menú lateral) -->
  <div id="nav-principal" class="shrink-0 bg-cg-card rounded-t-[28px] shadow-[0_-8px_24px_-12px_rgba(36,28,46,0.18)] px-4 pt-3 pb-3">
    <div class="flex items-center justify-around">
      <button class="tab-btn flex flex-col items-center gap-1 py-2 px-3" data-tab="dashboard">
        <span class="tab-pill"></span>
        <svg class="tab-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        <span>Dashboard</span>
      </button>
      <button class="tab-btn flex flex-col items-center gap-1 py-2 px-3" data-tab="ventas">
        <span class="tab-pill"></span>
        <svg class="tab-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <span>Ventas</span>
      </button>
      <button class="tab-btn flex flex-col items-center gap-1 py-2 px-3" data-tab="caja">
        <span class="tab-pill"></span>
        <svg class="tab-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>
        <span>Caja</span>
      </button>
      <button class="tab-btn flex flex-col items-center gap-1 py-2 px-3" data-tab="inventario">
        <span class="tab-pill"></span>
        <svg class="tab-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8V21H3V8"/><path d="M1 3h22v5H1z"/><path d="M10 12h4"/></svg>
        <span>Inventario</span>
      </button>
      <button class="tab-btn flex flex-col items-center gap-1 py-2 px-3" data-tab="compras">
        <span class="tab-pill"></span>
        <svg class="tab-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        <span>Compras</span>
      </button>
      <button class="tab-btn flex flex-col items-center gap-1 py-2 px-3" data-tab="clientes">
        <span class="tab-pill"></span>
        <svg class="tab-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>Clientes</span>
      </button>
    </div>
  </div>
</div>

<!-- Modal genérico (editar / crear producto / confirmar venta) -->
<div id="modal-overlay" class="screen-hidden fixed inset-0 modal-overlay items-end sm:items-center justify-center z-50 p-0 sm:p-4">
  <div id="modal-box" class="bg-cg-card w-full sm:max-w-[420px] sm:rounded-2xl rounded-t-2xl p-5 max-h-[85vh] overflow-y-auto"></div>
</div>

<!-- Librería compartida (escape de HTML, WhatsApp, CSV, cierre, errores) -->
<script src="js/lib/util.js"></script>
<!-- Envoltorio de las funciones transaccionales seguras (CG.rpc.*) -->
<script src="js/rpc.js"></script>

<!-- Módulos del sistema: cada archivo es una parte (si uno falla, las demás siguen funcionando).
     'inicio' va siempre al final. -->
<script src="js/app/estado.js"></script>
<script src="js/app/marca.js"></script>
<script src="js/app/base.js"></script>
<script src="js/app/compartido.js"></script>
<script src="js/app/datos.js"></script>
<script src="js/app/sesion.js"></script>
<script src="js/app/navegacion.js"></script>
<script src="js/app/dashboard.js"></script>
<script src="js/app/caja.js"></script>
<script src="js/app/dividir-cuenta.js"></script>
<script src="js/app/ventas.js"></script>
<script src="js/app/helados.js"></script>
<script src="js/app/historial-ventas.js"></script>
<script src="js/app/clientes.js"></script>
<script src="js/app/cobros.js"></script>
<script src="js/app/compras.js"></script>
<script src="js/app/inventario.js"></script>
<script src="js/app/catalogos.js"></script>
<script src="js/app/informes.js"></script>
<script src="js/app/configuracion.js"></script>
<script src="js/app/inicio.js"></script>

<!-- Registro del Service Worker + aviso de "sin internet" -->
<script src="js/pwa.js"></script>
</body>
</html>
