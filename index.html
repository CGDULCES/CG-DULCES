function actualizarRestoMixto() {
  const efectivo = Number(document.getElementById("mixto-efectivo").value) || 0;
  const transferencia = Number(document.getElementById("mixto-transferencia").value) || 0;
  const resto = window.__ventaTotal - efectivo - transferencia;
  document.getElementById("mixto-restante").textContent =
    resto === 0 ? "✓ Cubre el total exacto" : resto > 0 ? `Falta cubrir ${fmt(resto)}` : `Te pasaste por ${fmt(-resto)}`;
}

// Fecha de HOY según la hora de Paraguay (no UTC, que se adelanta un día por la tardecita/noche)
function fechaLocalHoy() {
  return new Date().toLocaleDateString("en-CA", { timeZone: "America/Asuncion" });
}

// Si la fecha elegida es hoy, usa la hora real actual. Si es un día anterior (carga tardía), usa el mediodía de ese día.
function fechaOAhora(fechaSeleccionada) {
  const hoy = fechaLocalHoy();
  if (fechaSeleccionada === hoy) return new Date().toISOString();
  return new Date(fechaSeleccionada + "T12:00:00").toISOString();
}

let procesandoVenta = false;

async function confirmSale() {
  if (procesandoVenta) return; // evita registrar la misma venta dos veces si se toca el botón rápido
  const items = Object.entries(cart).filter(([, q]) => q > 0);
  if (items.length === 0 && heladoCart.length === 0) return;
  if (!cajaRequerida()) return;

  const registrado_por = document.getElementById("registrado-por").value;
  const es_fiado = document.getElementById("venta-fiado").checked;
  const clienteVal = document.getElementById("venta-cliente").value;
  const cliente_id = clienteVal ? Number(clienteVal) : null;
  if (!cliente_id) { alert("Elegí un cliente (o creá uno rápido) para poder registrar la venta."); return; }
  const medio_pago = es_fiado ? "fiado" : (window.__medioPago || "efectivo");
  const fechaVenta = document.getElementById("venta-fecha").value;
  const created_at = fechaOAhora(fechaVenta);

  procesandoVenta = true;
  const btnConfirmar = document.getElementById("btn-confirmar-venta");
  if (btnConfirmar) { btnConfirmar.disabled = true; btnConfirmar.textContent = "Registrando..."; btnConfirmar.classList.add("opacity-60"); }

  try {

  let monto_efectivo = 0, monto_transferencia = 0;

  // Validar que haya stock suficiente de todo antes de tocar la base de datos
  for (const [id, qty] of items) {
    const p = productos.find((pr) => pr.id === Number(id));
    if (qty > p.stock) { alert(`No hay suficiente stock de "${p.nombre}". Disponible: ${p.stock}.`); return; }
  }

  // Pajitas: uso ilimitado mientras haya un paquete abierto (igual que cucharita/servilleta)
  const totalPajitas = items.reduce((s, [id, qty]) => s + (pajitasCart[Number(id)] || 0), 0);
  if (totalPajitas > 0) {
    const pajita = insumoPorNombre("Pajita");
    const checkPajita = await validarConsumoIlimitado(pajita, totalPajitas);
    if (!checkPajita.ok) { alert(checkPajita.mensaje); return; }
  }

  if (heladoCart.length > 0) {
    const necesarioPorId = {};
    const bolasPorBalde = {};
    const coberturaPorSabor = {};
    const sumarNecesario = (id, cant) => { necesarioPorId[id] = (necesarioPorId[id] || 0) + cant; };
    const cucharita = insumoPorNombre("Cucharita");
    const servilleta = insumoPorNombre("Servilleta");
    const poteIsopor = insumoPorNombre("Pote de Isopor 1/4");
    const vasito = insumoPorNombre("Vasito");
    let cucharitaNecesario = 0, servilletaNecesario = 0;
    heladoCart.forEach((h) => {
      h.bolas.forEach((saborId) => { bolasPorBalde[saborId] = (bolasPorBalde[saborId] || 0) + 1; });
      if (h.tipo === "bola" && h.envaseId) sumarNecesario(h.envaseId, 1);
      if (h.tipo === "pote14" && poteIsopor) sumarNecesario(poteIsopor.id, 1);
      if (h.tipo === "bola" && vasito && h.envaseId === vasito.id) cucharitaNecesario += 1;
      if (h.servilleta) servilletaNecesario += 1;
      if (h.cobertura && h.coberturaId) coberturaPorSabor[h.coberturaId] = (coberturaPorSabor[h.coberturaId] || 0) + 1;
    });
    // Envase y pote: siguen con stock normal (limitado)
    for (const [id, necesario] of Object.entries(necesarioPorId)) {
      const p = productos.find((pr) => pr.id === Number(id));
      if (p && necesario > p.stock) { alert(`No hay suficiente stock de "${p.nombre}". Disponible: ${p.stock}, necesitás ${necesario}.`); return; }
    }
    // Baldes, cucharita, servilleta y cobertura (por sabor): uso ilimitado mientras haya un paquete/balde abierto
    const validarIlimitado = async (producto, necesario) => {
      const r = await validarConsumoIlimitado(producto, necesario);
      if (!r.ok) alert(r.mensaje);
      return r.ok;
    };
    for (const saborId of Object.keys(bolasPorBalde)) {
      if (!(await validarIlimitado(productos.find((pr) => pr.id === Number(saborId)), bolasPorBalde[saborId]))) return;
    }
    if (!(await validarIlimitado(cucharita, cucharitaNecesario))) return;
    if (!(await validarIlimitado(servilleta, servilletaNecesario))) return;
    for (const saborId of Object.keys(coberturaPorSabor)) {
      if (!(await validarIlimitado(productos.find((pr) => pr.id === Number(saborId)), coberturaPorSabor[saborId]))) return;
    }
  }

  const calculo = calcularCarritoPromos();
  let subtotalTotal = calculo.subtotalTotal, descuentoTotal = calculo.descuentoTotal;
  const lineas = calculo.lineas.map((l) => ({
    producto_id: l.producto.id, cantidad: l.cantidad, precio_unitario: l.producto.precio_venta,
    costo_unitario: l.producto.costo_ultimo, descuento: l.descuento, subtotal: l.subtotal,
  }));

  // Líneas de helados armados
  heladoCart.forEach((h) => {
    const producto = productos.find((p) => p.id === h.productoId);
    const cantidad = h.tipo === "bola" ? h.bolas.length : 1;
    subtotalTotal += h.total;
    lineas.push({ producto_id: producto.id, cantidad, precio_unitario: producto.precio_venta, costo_unitario: producto.costo_ultimo, descuento: 0, subtotal: h.total });
  });

  // Descuento manual: se reparte proporcionalmente entre todas las líneas de la venta
  const descuentoManual = Math.min(window.__ventaDescuentoManual || 0, subtotalTotal - descuentoTotal);
  if (descuentoManual > 0) {
    const baseParaReparto = subtotalTotal - descuentoTotal;
    lineas.forEach((l) => {
      const parte = baseParaReparto > 0 ? (l.subtotal / baseParaReparto) * descuentoManual : 0;
      l.descuento += parte;
      l.subtotal -= parte;
    });
    descuentoTotal += descuentoManual;
  }

  const total = subtotalTotal - descuentoTotal;

  if (!es_fiado) {
    if (medio_pago === "mixto") {
      monto_efectivo = Number(document.getElementById("mixto-efectivo").value) || 0;
      monto_transferencia = Number(document.getElementById("mixto-transferencia").value) || 0;
      if (monto_efectivo + monto_transferencia !== total) {
        alert("El efectivo y la transferencia tienen que sumar exactamente el total de la venta.");
        return;
      }
    } else if (medio_pago === "efectivo") {
      monto_efectivo = total;
    } else {
      monto_transferencia = total;
    }
  }

  const { data: venta, error: ventaError } = await sb
    .from("ventas")
    .insert({ subtotal: subtotalTotal, descuento_total: descuentoTotal, total, medio_pago, registrado_por, cliente_id, es_fiado, monto_efectivo, monto_transferencia, created_at })
    .select().single();
  if (ventaError) { alert("No se pudo registrar la venta."); console.error(ventaError); return; }

  const itemsToInsert = lineas.map((l) => ({ ...l, venta_id: venta.id }));
  await sb.from("venta_items").insert(itemsToInsert);

  // Descontar stock de productos normales
  for (const [id, qty] of items) {
    const p = productos.find((pr) => pr.id === Number(id));
    await sb.from("productos").update({ stock: p.stock - qty }).eq("id", p.id);
  }

  // Pajitas de todos los productos que las llevan, en esta venta
  if (totalPajitas > 0) {
    await aplicarConsumoIlimitado(insumoPorNombre("Pajita"), totalPajitas);
  }

  // Descontar insumos de cada helado armado
  const cucharita = insumoPorNombre("Cucharita");
  const servilleta = insumoPorNombre("Servilleta");
  const poteIsopor = insumoPorNombre("Pote de Isopor 1/4");

  // Bolas totales por sabor en toda la venta
  const bolasPorSaborTotal = {};
  heladoCart.forEach((h) => h.bolas.forEach((id) => { bolasPorSaborTotal[id] = (bolasPorSaborTotal[id] || 0) + 1; }));
  for (const [saborId, cant] of Object.entries(bolasPorSaborTotal)) {
    await aplicarConsumoIlimitado(productos.find((p) => p.id === Number(saborId)), cant);
  }

  // Cucharita (solo helados en vasito) y servilleta (según se eligió): ilimitados
  const vasitoDesc = insumoPorNombre("Vasito");
  const cucharitaTotal = heladoCart.filter((h) => h.tipo === "bola" && vasitoDesc && h.envaseId === vasitoDesc.id).length;
  const servilletaTotal = heladoCart.filter((h) => h.servilleta).length;
  await aplicarConsumoIlimitado(cucharita, cucharitaTotal);
  await aplicarConsumoIlimitado(servilleta, servilletaTotal);

  // Cobertura: por sabor elegido, también ilimitada
  const coberturaPorSaborTotal = {};
  heladoCart.forEach((h) => { if (h.cobertura && h.coberturaId) coberturaPorSaborTotal[h.coberturaId] = (coberturaPorSaborTotal[h.coberturaId] || 0) + 1; });
  for (const [saborId, cant] of Object.entries(coberturaPorSaborTotal)) {
    await aplicarConsumoIlimitado(productos.find((p) => p.id === Number(saborId)), cant);
  }

  for (const h of heladoCart) {
    // Envase (vasito/cucurucho) y pote: siguen con stock limitado normal
    if (h.tipo === "bola" && h.envaseId) {
      const envase = productos.find((p) => p.id === h.envaseId);
      if (envase) await sb.from("productos").update({ stock: envase.stock - 1 }).eq("id", envase.id);
    }
    if (h.tipo === "pote14" && poteIsopor) {
      await sb.from("productos").update({ stock: poteIsopor.stock - 1 }).eq("id", poteIsopor.id);
    }
  }

  // Registrar el/los movimiento(s) en caja (solo si no es fiado; lo fiado entra cuando se cobra)
  if (!es_fiado) {
    if (monto_efectivo > 0) await sb.from("caja_movimientos").insert({ caja_id: cajaActual.id, tipo: "venta", monto: monto_efectivo, medio_pago: "efectivo", venta_id: venta.id, fecha: created_at, descripcion: `Venta #${venta.id}` });
    if (monto_transferencia > 0) await sb.from("caja_movimientos").insert({ caja_id: cajaActual.id, tipo: "venta", monto: monto_transferencia, medio_pago: "transferencia", venta_id: venta.id, fecha: created_at, descripcion: `Venta #${venta.id}` });
  }
  await registrarHistorial("ventas", venta.id, "crear", `Venta de ${fmt(total)} por ${registrado_por}${es_fiado ? " (fiado)" : ""}${cliente_id ? " a " + (clientes.find((c) => c.id === cliente_id)?.nombre || "cliente") : ""}`);

  cart = {};
  pajitasCart = {};
  heladoCart = [];
  closeModal();
  activeTab = "dashboard";
  await loadAll();

  } finally {
    procesandoVenta = false;
    if (btnConfirmar) { btnConfirmar.disabled = false; btnConfirmar.textContent = "Registrar venta"; btnConfirmar.classList.remove("opacity-60"); }
  }
}

function renderRecetaLista(productoTerminadoId) {
  const filas = recetas.filter((r) => r.producto_terminado_id === productoTerminadoId);
  const insumosDisponibles = productos.filter((p) => p.es_insumo);
  if (filas.length === 0) return `<p class="text-[11px] text-[#8a7d94] mb-2">Todavía no cargaste ningún insumo en la receta.</p>`;
  return filas.map((r) => {
    const insumo = productos.find((p) => p.id === r.insumo_id);
    return `
    <div class="flex items-center justify-between bg-white rounded-lg px-2.5 py-2 mb-1.5">
      <span class="text-[12px] text-[#241C2E]">${insumo?.nombre || "?"}</span>
      <div class="flex items-center gap-2">
        <span class="font-mono-num text-[12px] text-[#8a7d94]">${r.cantidad}</span>
        <button onclick="quitarFilaReceta(${r.id}, ${productoTerminadoId})" class="text-[#D64545] text-[13px] leading-none">×</button>
      </div>
    </div>`;
  }).join("");
}

function agregarFilaReceta(productoTerminadoId) {
  const insumosDisponibles = productos.filter((p) => p.es_insumo);
  if (insumosDisponibles.length === 0) { alert("Primero cargá al menos un insumo en Inventario (marcado como 'Es un insumo')."); return; }
  const opciones = insumosDisponibles.map((p) => `<option value="${p.id}">${p.nombre}${p.presentacion ? " · " + p.presentacion : ""}</option>`).join("");
  showModal(`
    <p class="font-display text-[18px] font-semibold text-[#241C2E] mb-4">Agregar insumo a la receta</p>
    <label class="text-[11px] font-semibold uppercase tracking-wide text-[#8a7d94]">Insumo</label>
    <select id="receta-insumo" class="w-full bg-[#F7F3FA] rounded-xl px-3 py-2.5 text-[14px] mt-1 mb-3 outline-none">${opciones}</select>
    <label class="text-[11px] font-semibold uppercase tracking-wide text-[#8a7d94]">Cantidad que lleva por cada 1 unidad producida</label>
    <input id="receta-cantidad" type="number" step="any" value="1" class="w-full bg-[#F7F3FA] rounded-xl px-3 py-2.5 text-[14px] mt-1 mb-5 outline-none" />
    <button onclick="saveFilaReceta(${productoTerminadoId})" class="w-full bg-[#6B2D5C] text-white font-semibold rounded-xl py-3">Agregar a la receta</button>
  `);
}

async function saveFilaReceta(productoTerminadoId) {
  const insumo_id = Number(document.getElementById("receta-insumo").value);
  const cantidad = Number(document.getElementById("receta-cantidad").value) || 0;
  if (cantidad <= 0) { alert("Poné una cantidad."); return; }
  const { error } = await sb.from("recetas").insert({ producto_terminado_id: productoTerminadoId, insumo_id, cantidad });
  if (error) { alert("No se pudo agregar."); console.error(error); return; }
  await loadAll();
  openEditProduct(productoTerminadoId);
}

async function quitarFilaReceta(recetaId, productoTerminadoId) {
  await sb.from("recetas").delete().eq("id", recetaId);
  await loadAll();
  openEditProduct(productoTerminadoId);
}

async function registrarProduccion(id) {
  if (procesandoAccion) return;
  const cantidad = Number(document.getElementById("fabricar-cantidad").value) || 0;
  if (cantidad <= 0) return;
  const p = productos.find((pr) => pr.id === id);
  const recetaDeEste = recetas.filter((r) => r.producto_terminado_id === id);

  if (recetaDeEste.length === 0) {
    if (!confirm("Este producto no tiene ninguna receta cargada, así que no se va a descontar ningún insumo — solo se va a sumar al stock. ¿Continuar igual?")) return;
  } else {
    // Validar que haya suficiente de cada insumo antes de tocar nada
    for (const r of recetaDeEste) {
      const insumo = productos.find((pr) => pr.id === r.insumo_id);
      const necesario = r.cantidad * cantidad;
      if (insumo && necesario > insumo.stock) {
        alert(`No hay suficiente "${insumo.nombre}" para producir ${cantidad}. Necesitás ${necesario}, hay ${insumo.stock}.`);
        return;
      }
    }
  }

  procesandoAccion = true;
  try {
    for (const r of recetaDeEste) {
      const insumo = productos.find((pr) => pr.id === r.insumo_id);
      if (insumo) await sb.from("productos").update({ stock: insumo.stock - r.cantidad * cantidad }).eq("id", insumo.id);
    }
    await sb.from("productos").update({ stock: p.stock + cantidad }).eq("id", id);
    const detalleReceta = recetaDeEste.map((r) => {
      const insumo = productos.find((pr) => pr.id === r.insumo_id);
      return `${insumo?.nombre || "?"} −${r.cantidad * cantidad}`;
    }).join(", ");
    await registrarHistorial("productos", id, "editar", `Producción registrada: +${cantidad} ${p.nombre}${detalleReceta ? ` (consumió: ${detalleReceta})` : " (sin receta cargada)"}`);
    closeModal();
    await loadAll();
  } finally {
    procesandoAccion = false;
  }
}

async function marcarConsumibleTerminado(id) {
  const p = productos.find((pr) => pr.id === id);
  const usados = Number(p.bolas_vendidas_actual || 0);
  if (usados === 0) { alert("Este producto todavía no registra usos."); return; }
  const esBalde = p.producto_base === "Balde Helado";
  if (!confirm(`¿Marcar como terminado? Rindió ${usados} ${esBalde ? "bolas" : "usos"}.`)) return;
  await sb.from("helado_rendimientos").insert({ producto_id: id, bolas: usados });
  await sb.from("productos").update({ bolas_vendidas_actual: 0 }).eq("id", id);
  await registrarHistorial("productos", id, "editar", `${p.presentacion || p.nombre} terminado — rindió ${usados} ${esBalde ? "bolas" : "usos"}`);
  closeModal();
  await loadAll();
}

async function cargarHielo() {
  const cantidad = Number(document.getElementById("cargar-hielo-cantidad").value) || 0;
  if (cantidad <= 0) return;
  const bolsita = productos.find((p) => p.nombre === "Bolsita de Hielo");
  const hielo = productos.find((p) => p.nombre === "Hielo · Bolsa");
  if (!bolsita || !hielo) { alert("Falta cargar 'Bolsita de Hielo' o 'Hielo · Bolsa' en productos."); return; }

  const check = await validarConsumoIlimitado(bolsita, cantidad);
  if (!check.ok) { alert(check.mensaje); return; }

  await aplicarConsumoIlimitado(bolsita, cantidad);
  await sb.from("productos").update({ stock: hielo.stock + cantidad }).eq("id", hielo.id);
  await registrarHistorial("productos", hielo.id, "editar", `Se cargaron ${cantidad} bolsitas de hielo con agua`);
  closeModal();
  await loadAll();
}

async function saveEditProduct(id) {
  const nombre = document.getElementById("edit-nombre").value.trim();
  const categoria_id = Number(document.getElementById("edit-categoria").value);
  const presentacion = document.getElementById("edit-presentacion").value.trim() || null;
  const es_insumo = document.getElementById("edit-es-insumo").checked;
  const favorito = document.getElementById("edit-favorito").checked;
  const usa_pajita = document.getElementById("edit-usa-pajita").checked;
  const stock = Number(document.getElementById("edit-stock").value);
  if (stock < 0) { alert("El stock no puede quedar en negativo."); return; }
  const stock_minimo = Number(document.getElementById("edit-minimo").value);
  const precio_venta = Number(document.getElementById("edit-precio").value);
  const costo_ultimo = Number(document.getElementById("edit-costo").value);
  const anterior = productos.find((p) => p.id === id);
  const { error } = await sb.from("productos").update({ nombre, categoria_id, presentacion, es_insumo, favorito, usa_pajita, stock, stock_minimo, precio_venta, costo_ultimo }).eq("id", id);
  if (error) { alert("No se pudo guardar."); console.error(error); return; }
  const cambioStock = anterior && anterior.stock !== stock ? ` (stock ${anterior.stock} → ${stock})` : "";
  await registrarHistorial("productos", id, "editar", `Editado: ${nombre}${cambioStock}`);
  closeModal();
  await loadAll();
}

async function deleteProduct(id) {
  const p = productos.find((pr) => pr.id === id);
  if (p && (p.nombre === "Helado · Bola" || p.nombre === "Helado · Pote 1/4")) {
    alert("Este producto es necesario para que funcione la venta de Helados y no se puede eliminar. Si querés dejar de venderlo, poné el precio en 0 en vez de borrarlo.");
    return;
  }
  if (!confirm("¿Eliminar este producto? Ya no va a aparecer en la app, pero se conserva en el historial de ventas pasadas.")) return;
  const { error } = await sb.from("productos").update({ activo: false }).eq("id", id);
  if (error) { alert("No se pudo eliminar."); console.error(error); return; }
  await registrarHistorial("productos", id, "eliminar", `Producto eliminado: ${p?.nombre || ""}`);
  closeModal();
  await loadAll();
}

}

async function saveNewProduct() {
  const nombre = document.getElementById("new-nombre").value.trim();
  if (!nombre) { alert("Poné un nombre."); return; }
  const categoria_id = Number(document.getElementById("new-categoria").value);
  const presentacion = document.getElementById("new-presentacion").value.trim() || null;
  const precio_venta = Number(document.getElementById("new-precio").value) || 0;
  const costo_ultimo = Number(document.getElementById("new-costo").value) || 0;
  const stock = Number(document.getElementById("new-stock").value) || 0;
  const stock_minimo = Number(document.getElementById("new-minimo").value) || 0;

  const { data, error } = await sb.from("productos").insert({ nombre, categoria_id, presentacion, precio_venta, costo_ultimo, stock, stock_minimo }).select().single();
  if (error) { alert("No se pudo crear el producto."); console.error(error); return; }
  await registrarHistorial("productos", data.id, "crear", `Producto creado: ${nombre}`);
  closeModal();
  await loadAll();
}

// ---------- Modal genérico ----------
function showModal(html) {
  document.getElementById("modal-box").innerHTML = html;
  document.getElementById("modal-overlay").classList.remove("screen-hidden");
  document.getElementById("modal-overlay").classList.add("flex");
}
function closeModal() {
  document.getElementById("modal-overlay").classList.add("screen-hidden");
  document.getElementById("modal-overlay").classList.remove("flex");
}
document.getElementById("modal-overlay").addEventListener("click", (e) => {
  if (e.target.id === "modal-overlay") closeModal();
});

// ---------- Navegación ----------
document.querySelectorAll(".tab-btn").forEach((btn) => {
  btn.addEventListener("click", async () => { activeTab = btn.dataset.tab; await loadAll(); });
});
document.getElementById("add-product-fab").addEventListener("click", openNewProduct);

checkSession();
</script>
