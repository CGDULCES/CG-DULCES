// ---------- Utilidades ----------
function ventasVisibles() {
  return productos.filter((p) => !p.es_insumo && p.categorias?.nombre !== HELADOS_OCULTO);
}

function baldesHelado() {
  return productos.filter((p) => p.producto_base === "Balde Helado");
}
function coberturasHelado() {
  return productos.filter((p) => p.producto_base === "Cobertura");
}
function insumoPorNombre(nombre) {
  return productos.find((p) => p.nombre === nombre && p.es_insumo);
}
function productoHeladoBola() {
  return productos.find((p) => p.nombre === "Helado · Bola");
}
function productoHeladoPote() {
  return productos.find((p) => p.nombre === "Helado · Pote 1/4");
}

function promoParaProducto(producto) {
  if (!producto) return null;
  return promociones.find((pr) => pr.categoria_id && pr.categoria_id === producto.categoria_id)
    || promociones.find((pr) => pr.producto_id === producto.id);
}

function cantidadGrupoEnCarrito(promo) {
  return productos
    .filter((p) => promoParaProducto(p)?.id === promo.id)
    .reduce((s, p) => s + (cart[p.id] || 0), 0);
}

// Calcula todas las líneas del carrito aplicando promociones que combinan
// productos de la misma categoría (ej: 2 alfajores de sabores distintos)
function calcularCarritoPromos() {
  const entradas = Object.entries(cart)
    .filter(([, q]) => q > 0)
    .map(([id, q]) => ({ producto: productos.find((p) => p.id === Number(id)), cantidad: q }));

  const grupos = {};
  entradas.forEach(({ producto, cantidad }) => {
    const promo = promoParaProducto(producto);
    const key = promo ? `promo-${promo.id}` : `solo-${producto.id}`;
    if (!grupos[key]) grupos[key] = { promo, items: [] };
    grupos[key].items.push({ producto, cantidad });
  });

  const lineas = [];
  let subtotalTotal = 0, descuentoTotal = 0;

  Object.values(grupos).forEach((g) => {
    const totalQty = g.items.reduce((s, it) => s + it.cantidad, 0);
    const normalTotal = g.items.reduce((s, it) => s + it.producto.precio_venta * it.cantidad, 0);

    if (g.promo && totalQty >= g.promo.cantidad_requerida) {
      const gruposCompletos = Math.floor(totalQty / g.promo.cantidad_requerida);
      const resto = totalQty % g.promo.cantidad_requerida;
      const precioPromedio = normalTotal / totalQty;
      const promoTotal = gruposCompletos * g.promo.precio_promocional + resto * precioPromedio;
      const descuento = normalTotal - promoTotal;

      g.items.forEach((it) => {
        const parteNormal = it.producto.precio_venta * it.cantidad;
        const parteDescuento = normalTotal > 0 ? descuento * (parteNormal / normalTotal) : 0;
        lineas.push({ producto: it.producto, cantidad: it.cantidad, subtotal: parteNormal - parteDescuento, descuento: parteDescuento });
        subtotalTotal += parteNormal;
        descuentoTotal += parteDescuento;
      });
    } else {
      g.items.forEach((it) => {
        const subtotal = it.producto.precio_venta * it.cantidad;
        lineas.push({ producto: it.producto, cantidad: it.cantidad, subtotal, descuento: 0 });
        subtotalTotal += subtotal;
      });
    }
  });

  return { lineas, subtotalTotal, descuentoTotal, total: subtotalTotal - descuentoTotal };
}

function isSameDay(dateStr, ref) {
  return new Date(dateStr).toDateString() === ref.toDateString();
}

// Dinero real de un día puntual: ventas al contado de ese día + cobros de fiado recibidos ese día.
// Lo fiado NO cuenta hasta que se cobra, sin importar cuándo se hizo la venta.
function dineroRealDelDia(fecha) {
  const ventasContado = ventasHistoricas.filter((v) => isSameDay(v.created_at, fecha) && !v.es_fiado);
  let ganancia = ventasContado.reduce((s, v) => s + (v.venta_items || []).reduce((si, it) => si + it.subtotal, 0), 0);
  let gananciaReal = ventasContado.reduce((s, v) => s + (v.venta_items || []).reduce((si, it) => si + (it.subtotal - it.costo_unitario * it.cantidad), 0), 0);

  const cobrosDelDia = cobros.filter((c) => isSameDay(c.created_at, fecha));
  cobrosDelDia.forEach((c) => {
    ganancia += Number(c.monto);
    const venta = ventasHistoricas.find((v) => v.id === c.venta_id);
    if (venta && venta.total > 0) {
      const costoTotal = (venta.venta_items || []).reduce((s, it) => s + it.costo_unitario * it.cantidad, 0);
      const proporcionGanancia = (venta.total - costoTotal) / venta.total;
      gananciaReal += Number(c.monto) * proporcionGanancia;
    } else {
      gananciaReal += Number(c.monto);
    }
  });

  return { ganancia, gananciaReal };
}

function todayStats() {
  return dineroRealDelDia(new Date());
}

function weekTotal() {
  return last7DaysChartData().totals.reduce((s, t) => s + t, 0);
}

function last7DaysChartData() {
  const labels = ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
  const days = [];
  for (let i = 6; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); days.push(d); }
  const totals = days.map((d) => dineroRealDelDia(d).ganancia);
  const dayLabels = days.map((d) => labels[(d.getDay() + 6) % 7]);
  return { dayLabels, totals };
}

function topProductName() {
  const counts = {};
  ventasHistoricas.forEach((v) => (v.venta_items || []).forEach((it) => {
    const name = it.productos?.nombre || "—";
    counts[name] = (counts[name] || 0) + Number(it.cantidad);
  }));
  const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  return sorted.length ? sorted[0][0] : "—";
}

function agruparPorCategoria(lista) {
  const grupos = {};
  lista.forEach((p) => {
    const cat = p.categorias?.nombre || "Sin categoría";
    if (!grupos[cat]) grupos[cat] = [];
    grupos[cat].push(p);
  });
  return grupos;
}

function sectionLabel(text) {

}

  if (activeTab === "proveedores") renderProveedores(content);
  if (activeTab === "clientes") renderClientes(content);
  if (activeTab === "cliente-detalle") renderClienteDetalle(content);

  if (activeTab === "auditoria") renderAuditoria(content);
  if (activeTab === "todas-ventas") renderTodasVentas(content);
  if (activeTab === "masopciones") renderMasOpciones(content);
  if (activeTab === "reportes") renderReportes(content);
  if (activeTab === "promociones") renderPromociones(content);
  if (activeTab === "categorias") renderCategorias(content);
  if (activeTab === "configuracion") renderConfiguracion(content);

function renderDashboard(content) {
  const { ganancia, gananciaReal } = todayStats();
  const ventasSemana = weekTotal();
  const lowStock = productos.filter((p) => !p.es_insumo && p.nombre !== "Helado · Bola" && p.nombre !== "Helado · Pote 1/4" && p.stock <= p.stock_minimo);
  const recientes = ventasHistoricas.slice(0, 4);

  content.innerHTML = `
    <div class="space-y-5">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-black/[0.04]">
          <p class="text-[11px] text-[#8a7d94] font-medium mb-1">Ventas de la semana</p>

// ---------- Caja ----------
function esMedioBanco(medio) {
  return medio === "transferencia" || medio === "qr";
}

function saldosCajaActual() {
  if (!cajaActual) return { efectivo: 0, banco: 0 };
  let efectivo = Number(cajaActual.apertura_efectivo || 0);
  let banco = Number(cajaActual.apertura_banco || 0);
  cajaMovimientos.forEach((m) => {
    const monto = Number(m.monto);
    const esIngreso = m.tipo === "venta" || m.tipo === "cobro" || m.tipo === "ingreso_extra";
    const signo = esIngreso ? 1 : -1; // retiro y compra restan
    if (esMedioBanco(m.medio_pago)) banco += signo * monto;
    else efectivo += signo * monto;
  });
  return { efectivo, banco };
}

function deudaTotalClientes() {
  return clientes.reduce((s, c) => s + deudaCliente(c.id), 0);
}

function cajaRequerida() {
  if (!cajaActual) { alert("Primero tenés que abrir la caja para poder hacer esto."); return false; }
  return true;
}

async function crearCajaInicial() {
  const apertura_efectivo = Number(document.getElementById("capital-efectivo").value) || 0;
  const apertura_banco = Number(document.getElementById("capital-banco").value) || 0;
  const registrado_por = usuarios[0]?.nombre || "";
  const { data, error } = await sb.from("caja").insert({ apertura_efectivo, apertura_banco, registrado_por, estado: "abierta" }).select().single();
  if (error) { alert("No se pudo iniciar la caja."); console.error(error); return; }
  await registrarHistorial("caja", data.id, "crear", `Capital inicial del sistema — efectivo ${fmt(apertura_efectivo)}, banco ${fmt(apertura_banco)}`);
  closeModal();
  await loadAll();
}

async function abrirCaja() {
  if (procesandoAccion) return;
  if (cajaActual) return; // ya hay una caja abierta, no abrir otra
  procesandoAccion = true;
  try {
    const { count } = await sb.from("caja").select("*", { count: "exact", head: true });
    if (count === 0) { mostrarCapitalInicial(); return; }

    const registrado_por = usuarios[0]?.nombre || "";
    // Repone automáticamente lo que quedó al cerrar la última caja
    const { data: ultimaCerrada } = await sb.from("caja").select("*").eq("estado", "cerrada").order("fecha_cierre", { ascending: false }).limit(1);
    const previa = ultimaCerrada && ultimaCerrada.length ? ultimaCerrada[0] : null;
    const apertura_efectivo = previa ? Number(previa.cierre_efectivo || 0) : 0;
    const apertura_banco = previa ? Number(previa.cierre_banco || 0) : 0;

    const { data, error } = await sb.from("caja").insert({ apertura_efectivo, apertura_banco, registrado_por, estado: "abierta" }).select().single();
    if (error) { alert("No se pudo abrir la caja."); console.error(error); return; }
    await registrarHistorial("caja", data.id, "crear", `Caja abierta — efectivo ${fmt(apertura_efectivo)}, banco ${fmt(apertura_banco)}`);
    await loadAll();
  } finally {
    procesandoAccion = false;
  }
}

async function calcularSaldosCajaFrescos() {
  if (!cajaActual) return { efectivo: 0, banco: 0 };
  const { data: movsFrescos } = await sb.from("caja_movimientos").select("*").eq("caja_id", cajaActual.id);
  let efectivo = Number(cajaActual.apertura_efectivo || 0);
  let banco = Number(cajaActual.apertura_banco || 0);
  (movsFrescos || []).forEach((m) => {
    const monto = Number(m.monto);
    const esIngreso = m.tipo === "venta" || m.tipo === "cobro" || m.tipo === "ingreso_extra";
    const signo = esIngreso ? 1 : -1;
    if (esMedioBanco(m.medio_pago)) banco += signo * monto;
    else efectivo += signo * monto;
  });
  return { efectivo, banco };
}

async function openCerrarCaja() {
  const { efectivo, banco } = await calcularSaldosCajaFrescos();
  showModal(`

    <p class="text-[12px] text-[#8a7d94] mb-4">Según el sistema: ${fmt(efectivo)} en efectivo, ${fmt(banco)} en banco</p>
    <label class="text-[11px] font-semibold uppercase tracking-wide text-[#8a7d94]">Efectivo contado (opcional)</label>
    <input id="caja-cierre-efectivo" type="number" placeholder="${efectivo}" class="w-full bg-[#F7F3FA] rounded-xl px-3 py-2.5 text-[14px] mt-1 mb-3 outline-none" />
    <label class="text-[11px] font-semibold uppercase tracking-wide text-[#8a7d94]">Banco contado (opcional)</label>
    <input id="caja-cierre-banco" type="number" placeholder="${banco}" class="w-full bg-[#F7F3FA] rounded-xl px-3 py-2.5 text-[14px] mt-1 mb-5 outline-none" />

}
async function saveCerrarCaja(efectivoCalculado, bancoCalculado) {
  if (procesandoAccion) return;
  procesandoAccion = true;
  try {
  const valorEfectivo = document.getElementById("caja-cierre-efectivo").value;
  const valorBanco = document.getElementById("caja-cierre-banco").value;
  const cierre_efectivo = valorEfectivo ? Number(valorEfectivo) : efectivoCalculado;
  const cierre_banco = valorBanco ? Number(valorBanco) : bancoCalculado;
  const { error } = await sb.from("caja").update({ estado: "cerrada", fecha_cierre: new Date().toISOString(), cierre_efectivo, cierre_banco }).eq("id", cajaActual.id);
  if (error) { alert("No se pudo cerrar la caja."); console.error(error); return; }
  await registrarHistorial("caja", cajaActual.id, "editar", `Caja cerrada — efectivo ${fmt(cierre_efectivo)}, banco ${fmt(cierre_banco)}`);
  closeModal();
  await loadAll();
  } finally {
    procesandoAccion = false;
  }
}

function openMovimientoCaja(tipo) {
  const titulo = tipo === "retiro" ? "Registrar retiro" : "Registrar ingreso extra";
  showModal(`
    <p class="font-display text-[18px] font-semibold text-[#241C2E] mb-4">${titulo}</p>
    <label class="text-[11px] font-semibold uppercase tracking-wide text-[#8a7d94]">Monto</label>
    <input id="mov-caja-monto" type="number" class="w-full bg-[#F7F3FA] rounded-xl px-3 py-2.5 text-[14px] mt-1 mb-3 outline-none" />
    <label class="text-[11px] font-semibold uppercase tracking-wide text-[#8a7d94]">¿De dónde?</label>
    <select id="mov-caja-medio" class="w-full bg-[#F7F3FA] rounded-xl px-3 py-2.5 text-[14px] mt-1 mb-3 outline-none">
      <option value="efectivo">Efectivo</option>
      <option value="transferencia">Cuenta bancaria</option>
    </select>
    <label class="text-[11px] font-semibold uppercase tracking-wide text-[#8a7d94]">Motivo</label>
    <input id="mov-caja-descripcion" type="text" class="w-full bg-[#F7F3FA] rounded-xl px-3 py-2.5 text-[14px] mt-1 mb-5 outline-none" />
    <button onclick="saveMovimientoCaja('${tipo}')" class="w-full bg-[#6B2D5C] text-white font-semibold rounded-xl py-3">Guardar</button>
  `);
}
async function saveMovimientoCaja(tipo) {
  const monto = Number(document.getElementById("mov-caja-monto").value) || 0;
  if (monto <= 0) return;
  const medio_pago = document.getElementById("mov-caja-medio").value;
  const descripcion = document.getElementById("mov-caja-descripcion").value.trim();

  if (tipo === "retiro") {
    const saldos = saldosCajaActual();
    const disponible = esMedioBanco(medio_pago) ? saldos.banco : saldos.efectivo;
    if (monto > disponible) {
      alert(`No hay suficiente en ${esMedioBanco(medio_pago) ? "la cuenta bancaria" : "efectivo"}. Disponible: ${fmt(disponible)}.`);
      return;
    }
  }

  const { error } = await sb.from("caja_movimientos").insert({ caja_id: cajaActual.id, tipo, monto, medio_pago, descripcion });
  if (error) { alert("No se pudo registrar."); console.error(error); return; }
  await registrarHistorial("caja_movimientos", cajaActual.id, "crear", `${tipo === "retiro" ? "Retiro" : "Ingreso extra"} de ${fmt(monto)}${descripcion ? " — " + descripcion : ""}`);
  closeModal();
  await loadAll();
}

// ---------- Dividir cuenta entre varios clientes ----------
window.__divCuentaSeleccion = new Set();

function openDividirCuenta() {
  if (!cajaRequerida()) return;
  window.__divCuentaSeleccion = new Set();
  window.__divCuentaProductoId = ventasVisibles()[0]?.id;
  window.__divCuentaCantidad = 1;
  window.__divCuentaFecha = fechaLocalHoy();
  renderDividirCuentaModal();
}

function renderDividirCuentaModal() {
  const productos_ = ventasVisibles();
  const producto = productos_.find((p) => p.id === window.__divCuentaProductoId);
  const total = producto ? producto.precio_venta * window.__divCuentaCantidad : 0;
  const cantidadSeleccionados = window.__divCuentaSeleccion.size;
  const porPersona = cantidadSeleccionados > 0 ? total / cantidadSeleccionados : 0;

  showModal(`
    <p class="font-display text-[18px] font-semibold text-[#241C2E] mb-4">Dividir cuenta</p>

    <label class="text-[11px] font-semibold uppercase tracking-wide text-[#8a7d94]">Fecha</label>

    <label class="text-[11px] font-semibold uppercase tracking-wide text-[#8a7d94]">Producto</label>
    <select id="div-producto" onchange="cambiarProductoDivCuenta(this.value)" class="w-full bg-[#F7F3FA] rounded-xl px-3 py-2.5 text-[14px] mt-1 mb-3 outline-none">
      ${productos_.map((p) => `<option value="${p.id}" ${p.id===window.__divCuentaProductoId?"selected":""}>${p.nombre}</option>`).join("")}
    </select>

    <label class="text-[11px] font-semibold uppercase tracking-wide text-[#8a7d94]">Cantidad</label>
    <input id="div-cantidad" type="number" value="${window.__divCuentaCantidad}" onchange="cambiarCantidadDivCuenta(this.value)" class="w-full bg-[#F7F3FA] rounded-xl px-3 py-2.5 text-[14px] mt-1 mb-4 outline-none" />

    <label class="text-[11px] font-semibold uppercase tracking-wide text-[#8a7d94]">¿Entre quiénes se reparte?</label>
    <div class="space-y-1.5 mt-2 mb-4 max-h-[180px] overflow-y-auto">
      ${clientes.map((c) => `
        <label class="flex items-center gap-2 bg-[#F7F3FA] rounded-lg px-3 py-2">
          <input type="checkbox" onchange="toggleClienteDivCuenta(${c.id}, this.checked)" ${window.__divCuentaSeleccion.has(c.id)?"checked":""} class="w-4 h-4" />
          <span class="text-[13px] text-[#241C2E]">${c.nombre}</span>
        </label>`).join("")}
    </div>
    <div class="flex gap-2 mb-4">
      <input id="div-nuevo-cliente" type="text" placeholder="Nombre de cliente nuevo" class="flex-1 bg-[#F7F3FA] rounded-xl px-3 py-2.5 text-[14px] outline-none" />
      <button type="button" onclick="crearClienteDivCuenta()" class="bg-[#6B2D5C] text-white text-[13px] font-semibold px-3.5 rounded-xl">+</button>
    </div>

    <div class="bg-[#F7F3FA] rounded-xl p-3 mb-5">
      <div class="flex items-center justify-between text-[13px] mb-1">
        <span class="text-[#8a7d94]">Total</span>
        <span class="font-mono-num font-semibold">${fmt(total)}</span>
      </div>
      <div class="flex items-center justify-between text-[13px]">
        <span class="text-[#8a7d94]">Entre ${cantidadSeleccionados} persona(s)</span>
        <span class="font-mono-num font-semibold text-[#6B2D5C]">${fmt(porPersona)} c/u</span>
      </div>
    </div>

    <button onclick="confirmarDividirCuenta()" class="w-full bg-[#2F9E7A] text-white font-semibold rounded-xl py-3">Registrar y dividir</button>

function cambiarProductoDivCuenta(id) {
  window.__divCuentaProductoId = Number(id);
  renderDividirCuentaModal();
}
function cambiarCantidadDivCuenta(valor) {
  window.__divCuentaCantidad = Number(valor) || 1;
  renderDividirCuentaModal();
}
function toggleClienteDivCuenta(id, checked) {
  if (checked) window.__divCuentaSeleccion.add(id);
  else window.__divCuentaSeleccion.delete(id);
  renderDividirCuentaModal();
}
async function crearClienteDivCuenta() {
  const nombre = document.getElementById("div-nuevo-cliente").value.trim();
  if (!nombre) return;
  const { data, error } = await sb.from("clientes").insert({ nombre }).select().single();
  if (error) { alert("No se pudo crear el cliente."); console.error(error); return; }
  await registrarHistorial("clientes", data.id, "crear", `Cliente creado: ${nombre}`);
  clientes.push(data);
  window.__divCuentaSeleccion.add(data.id);
  renderDividirCuentaModal();
}

let procesandoAccion = false;

async function confirmarDividirCuenta() {
  if (procesandoAccion) return;
  const producto = productos.find((p) => p.id === window.__divCuentaProductoId);
  const cantidad = window.__divCuentaCantidad;
  const seleccion = [...window.__divCuentaSeleccion];
  if (!producto) return;
  if (cantidad > producto.stock) { alert(`No hay suficiente stock de "${producto.nombre}". Disponible: ${producto.stock}.`); return; }
  if (seleccion.length < 2) { alert("Elegí al menos 2 clientes para dividir la cuenta."); return; }
  procesandoAccion = true;

  try {
  const total = producto.precio_venta * cantidad;
  const registrado_por = usuarios[0]?.nombre || "";
  const created_at = fechaOAhora(window.__divCuentaFecha);

  // Un solo registro de venta (para el stock), a nombre del primer cliente elegido
  const { data: venta, error } = await sb
    .from("ventas")
    .insert({ subtotal: total, descuento_total: 0, total, medio_pago: "fiado", registrado_por, cliente_id: null, es_fiado: true, created_at })
    .select().single();
  if (error) { alert("No se pudo registrar."); console.error(error); return; }

  await sb.from("venta_items").insert({ venta_id: venta.id, producto_id: producto.id, cantidad, precio_unitario: producto.precio_venta, costo_unitario: producto.costo_ultimo, descuento: 0, subtotal: total });
  await sb.from("productos").update({ stock: producto.stock - cantidad }).eq("id", producto.id);

  // Repartir el monto entre todos los elegidos (ajustando centavos en el primero para que sume exacto)
  const porPersona = Math.floor(total / seleccion.length);
  const resto = total - porPersona * seleccion.length;
  const filas = seleccion.map((clienteId, i) => ({ venta_id: venta.id, cliente_id: clienteId, monto: porPersona + (i === 0 ? resto : 0) }));
  await sb.from("venta_repartos").insert(filas);

  const nombres = seleccion.map((id) => clientes.find((c) => c.id === id)?.nombre).join(", ");
  await registrarHistorial("ventas", venta.id, "crear", `Cuenta dividida: ${producto.nombre} (${fmt(total)}) entre ${nombres}`);

  closeModal();
  activeTab = "dashboard";
  await loadAll();
  } finally {
    procesandoAccion = false;
  }
}

// ---------- Clientes y Fiado ----------
function deudaCliente(clienteId) {
  const ventasFiado = ventasClientes.filter((v) => v.cliente_id === clienteId && v.es_fiado);
  const deudaDirecta = ventasFiado.reduce((s, v) => {
    const pagadoVenta = cobros.filter((c) => c.venta_id === v.id).reduce((ss, c) => ss + Number(c.monto), 0);
    return s + Math.max(0, Number(v.total) - pagadoVenta);
  }, 0);
  const deudaCompartida = repartosClientes.filter((r) => r.cliente_id === clienteId).reduce((s, r) => {
    const pagado = cobros.filter((c) => c.venta_id === r.venta_id && c.cliente_id === clienteId).reduce((ss, c) => ss + Number(c.monto), 0);
    return s + Math.max(0, Number(r.monto) - pagado);
  }, 0);
  return deudaDirecta + deudaCompartida;
}
function totalCompradoCliente(clienteId) {
  const directo = ventasClientes.filter((v) => v.cliente_id === clienteId).reduce((s, v) => s + Number(v.total), 0);
  const compartido = repartosClientes.filter((r) => r.cliente_id === clienteId).reduce((s, r) => s + Number(r.monto), 0);
  return directo + compartido;
}

const PRODUCTOS_HELADO_SIN_STOCK_DIRECTO = ["Helado · Bola", "Helado · Pote 1/4"];

async function deleteVenta(ventaId) {
  if (!confirm("¿Eliminar esta venta? Se deshace todo lo que generó: cobros, movimientos de caja y stock. No se puede deshacer.")) return;
  await deleteVentaSinConfirmar(ventaId);
}

async function deleteVentaSinConfirmar(ventaId) {
  if (procesandoAccion) return;
  procesandoAccion = true;
  try {

  // Traer los ítems reales de la venta (por si el listado en pantalla no los tiene completos)
  const { data: items } = await sb.from("venta_items").select("producto_id, cantidad, productos(nombre)").eq("venta_id", ventaId);

  // Revertir cobros hechos a esta venta (y sus movimientos de caja)
  const { data: cobrosVenta } = await sb.from("cobros").select("id").eq("venta_id", ventaId);
  const cobroIds = (cobrosVenta || []).map((c) => c.id);
  if (cobroIds.length > 0) {
    await sb.from("caja_movimientos").delete().in("cobro_id", cobroIds);
    await sb.from("cobros").delete().in("id", cobroIds);
  }

  // Revertir el movimiento de caja de la venta original (si no fue fiada)
  await sb.from("caja_movimientos").delete().eq("venta_id", ventaId);

  // Revertir reparto de cuenta compartida, si la tenía
  await sb.from("venta_repartos").delete().eq("venta_id", ventaId);

  // Restaurar stock de productos normales (los de Helado armado no se revierten automáticamente)
  let huboHelado = false;
  for (const it of items || []) {
    if (PRODUCTOS_HELADO_SIN_STOCK_DIRECTO.includes(it.productos?.nombre)) { huboHelado = true; continue; }
    const p = productos.find((pr) => pr.id === it.producto_id);
    if (p) await sb.from("productos").update({ stock: p.stock + it.cantidad }).eq("id", p.id);
  }

  await sb.from("ventas").delete().eq("id", ventaId);
  await registrarHistorial("ventas", ventaId, "eliminar", `Venta eliminada (carga duplicada u error)`);

  if (huboHelado) {
    alert("Listo. Ojo: esta venta tenía Helados armados — el dinero y la deuda ya se revirtieron, pero el consumo de bolas/insumos de Helado no se deshace solo. Si hace falta, ajustalo a mano en Inventario.");
  }

  await loadAll();
  if (window.__clienteDetalleId) await abrirClienteDetalle(window.__clienteDetalleId);
  } finally {

  }
}

async function deleteRepartoCompartido(ventaId) {

}

function cambiarItemEditVenta(i, campo, valor) {

}
function agregarItemEditVenta() {

  window.__editVentaItems.push({ producto_id: primero?.id, cantidad: 1, precio_unitario: primero?.precio_venta || 0, costo_unitario: primero?.costo_ultimo || 0, descuento: 0 });
  renderEditVentaModal();
}
function quitarItemEditVenta(i) {
  window.__editVentaItems.splice(i, 1);
  renderEditVentaModal();
}

async function saveEditVenta() {
  if (procesandoAccion) return;
  procesandoAccion = true;
  try {
  const ventaId = window.__editVentaId;
  const cliente_id = window.__editVentaClienteId;
  const created_at = fechaOAhora(window.__editVentaFecha);

  // Validar antes de escribir nada: que ningún ajuste deje el stock en negativo
  for (const it of window.__editVentaItems) {
    const original = window.__editVentaOriginalItems.find((o) => o.id === it.id);
    const delta = it.cantidad - (original?.cantidad || 0); // + = se vende más, resta más stock
    const p = productos.find((pr) => pr.id === it.producto_id);
    if (p && p.stock - delta < 0) {
      alert(`Ese cambio dejaría el stock de "${p.nombre}" en negativo.`);
      return;
    }
  }

  // Aplicar cambios de stock
  for (const it of window.__editVentaItems) {
    if (it.id) {
      const original = window.__editVentaOriginalItems.find((o) => o.id === it.id);
      const delta = it.cantidad - (original?.cantidad || 0);
      const p = productos.find((pr) => pr.id === it.producto_id);
      if (p) await sb.from("productos").update({ stock: p.stock - delta }).eq("id", p.id);
      const subtotal = it.cantidad * it.precio_unitario - it.descuento;
      await sb.from("venta_items").update({ producto_id: it.producto_id, cantidad: it.cantidad, precio_unitario: it.precio_unitario, subtotal }).eq("id", it.id);
    } else {
      const p = productos.find((pr) => pr.id === it.producto_id);
      if (p) await sb.from("productos").update({ stock: p.stock - it.cantidad }).eq("id", p.id);
      const subtotal = it.cantidad * it.precio_unitario - it.descuento;
      await sb.from("venta_items").insert({ venta_id: ventaId, producto_id: it.producto_id, cantidad: it.cantidad, precio_unitario: it.precio_unitario, costo_unitario: it.costo_unitario, descuento: it.descuento, subtotal });
    }
  }
  for (const original of window.__editVentaOriginalItems) {
    const sigueExistiendo = window.__editVentaItems.some((it) => it.id === original.id);
    if (!sigueExistiendo) {
      const p = productos.find((pr) => pr.id === original.producto_id);
      if (p) await sb.from("productos").update({ stock: p.stock + original.cantidad }).eq("id", p.id);
      await sb.from("venta_items").delete().eq("id", original.id);
    }
  }

  const subtotalTotal = window.__editVentaItems.reduce((s, it) => s + it.cantidad * it.precio_unitario, 0);
  const descuentoTotal = window.__editVentaItems.reduce((s, it) => s + it.descuento, 0);
  const total = subtotalTotal - descuentoTotal;

  await sb.from("ventas").update({ cliente_id, subtotal: subtotalTotal, descuento_total: descuentoTotal, total, created_at }).eq("id", ventaId);

  // Si no era fiada, ajustar el movimiento de caja al nuevo total (mismo reparto efectivo/transferencia que tenía)
  const { data: ventaActual } = await sb.from("ventas").select("es_fiado, monto_efectivo, monto_transferencia").eq("id", ventaId).single();
  if (ventaActual && !ventaActual.es_fiado) {
    const totalAnterior = Number(ventaActual.monto_efectivo || 0) + Number(ventaActual.monto_transferencia || 0);
    const ratioEfectivo = totalAnterior > 0 ? Number(ventaActual.monto_efectivo || 0) / totalAnterior : 1;
    const nuevoEfectivo = Math.round(total * ratioEfectivo);
    const nuevaTransferencia = total - nuevoEfectivo;
    await sb.from("caja_movimientos").delete().eq("venta_id", ventaId).is("cobro_id", null);
    if (nuevoEfectivo > 0) await sb.from("caja_movimientos").insert({ caja_id: cajaActual?.id, tipo: "venta", monto: nuevoEfectivo, medio_pago: "efectivo", venta_id: ventaId, fecha: created_at, descripcion: `Venta #${ventaId} (editada)` });
    if (nuevaTransferencia > 0) await sb.from("caja_movimientos").insert({ caja_id: cajaActual?.id, tipo: "venta", monto: nuevaTransferencia, medio_pago: "transferencia", venta_id: ventaId, fecha: created_at, descripcion: `Venta #${ventaId} (editada)` });
    await sb.from("ventas").update({ monto_efectivo: nuevoEfectivo, monto_transferencia: nuevaTransferencia }).eq("id", ventaId);
  }

  await registrarHistorial("ventas", ventaId, "editar", `Venta editada, nuevo total ${fmt(total)}`);
  closeModal();
  await loadAll();
  if (window.__clienteDetalleId) await abrirClienteDetalle(window.__clienteDetalleId);
  else if (activeTab === "todas-ventas") await abrirTodasVentas();
  } finally {
    procesandoAccion = false;
  }
}

function pagadoDeVenta(ventaId) {
  return window.__clienteDetalleCobros.filter((c) => c.venta_id === ventaId).reduce((s, c) => s + Number(c.monto), 0);
}
function pagadoDeReparto(ventaId) {
  const clienteId = window.__clienteDetalleId;
  return window.__clienteDetalleCobros.filter((c) => c.venta_id === ventaId && c.cliente_id === clienteId).reduce((s, c) => s + Number(c.monto), 0);
}

function openCobroVenta(ventaId) {
  if (!cajaRequerida()) return;

window.__editRepartoVentaId = null;
window.__editRepartoSeleccion = new Set();
window.__editRepartoOriginal = [];

async function openEditReparto(ventaId) {
  const { data: repartos } = await sb.from("venta_repartos").select("id, cliente_id, monto, clientes(nombre)").eq("venta_id", ventaId);
  window.__editRepartoVentaId = ventaId;

  window.__editRepartoSeleccion = new Set((repartos || []).map((r) => r.cliente_id));
  renderEditRepartoModal();
}

function renderEditRepartoModal() {
  const original = window.__editRepartoOriginal;
  const total = original.reduce((s, r) => s + Number(r.monto), 0); // el total de la cuenta no cambia, solo cómo se reparte
  const seleccion = [...window.__editRepartoSeleccion];
  const porPersona = seleccion.length > 0 ? total / seleccion.length : 0;

  // Cobros ya hechos por cada persona (para no perderlos de vista al recalcular)
  const pagadoPorCliente = {};
  original.forEach((r) => {
    pagadoPorCliente[r.cliente_id] = cobros.filter((c) => c.venta_id === window.__editRepartoVentaId && c.cliente_id === r.cliente_id).reduce((s, c) => s + Number(c.monto), 0);
  });

  showModal(`
    <p class="font-display text-[18px] font-semibold text-[#241C2E] mb-1">Editar división</p>
    <p class="text-[12px] text-[#8a7d94] mb-4">Total de la cuenta: ${fmt(total)} · se reparte en partes iguales entre quienes tildes</p>

    <div class="space-y-1.5 mb-4 max-h-[220px] overflow-y-auto">
      ${clientes.map((c) => {
        const yaPago = pagadoPorCliente[c.id] > 0;
        return `
        <label class="flex items-center gap-2 bg-[#F7F3FA] rounded-lg px-3 py-2">
          <input type="checkbox" onchange="toggleClienteEditReparto(${c.id}, this.checked)" ${window.__editRepartoSeleccion.has(c.id)?"checked":""} class="w-4 h-4" />
          <span class="text-[13px] text-[#241C2E] flex-1">${c.nombre}${yaPago ? ` <span class="text-[10px] text-[#2F9E7A]">(ya pagó ${fmt(pagadoPorCliente[c.id])})</span>` : ""}</span>
        </label>`;
      }).join("")}
    </div>
    <div class="flex gap-2 mb-4">
      <input id="editreparto-nuevo-cliente" type="text" placeholder="Nombre de cliente nuevo" class="flex-1 bg-[#F7F3FA] rounded-xl px-3 py-2.5 text-[14px] outline-none" />
      <button type="button" onclick="crearClienteEditReparto()" class="bg-[#6B2D5C] text-white text-[13px] font-semibold px-3.5 rounded-xl">+</button>
    </div>

    <div class="bg-[#F7F3FA] rounded-xl p-3 mb-5">
      <div class="flex items-center justify-between text-[13px]">
        <span class="text-[#8a7d94]">Entre ${seleccion.length} persona(s)</span>
        <span class="font-mono-num font-semibold text-[#6B2D5C]">${fmt(porPersona)} c/u</span>
      </div>
    </div>

    <button onclick="saveEditReparto()" class="w-full bg-[#6B2D5C] text-white font-semibold rounded-xl py-3">Guardar nueva división</button>
  `);
}

function toggleClienteEditReparto(id, checked) {

  else window.__editRepartoSeleccion.delete(id);

async function crearClienteEditReparto() {
  const nombre = document.getElementById("editreparto-nuevo-cliente").value.trim();
  if (!nombre) return;
  const { data, error } = await sb.from("clientes").insert({ nombre }).select().single();
  if (error) { alert("No se pudo crear el cliente."); console.error(error); return; }
  await registrarHistorial("clientes", data.id, "crear", `Cliente creado: ${nombre}`);
  clientes.push(data);
  window.__editRepartoSeleccion.add(data.id);
  renderEditRepartoModal();
}

async function saveEditReparto() {
  if (procesandoAccion) return;
  const ventaId = window.__editRepartoVentaId;
  const original = window.__editRepartoOriginal;
  const seleccion = [...window.__editRepartoSeleccion];
  if (seleccion.length < 2) { alert("Tiene que haber al menos 2 personas en una cuenta dividida."); return; }
  procesandoAccion = true;
  try {

  const total = original.reduce((s, r) => s + Number(r.monto), 0);
  const porPersonaBase = Math.floor(total / seleccion.length);
  const resto = total - porPersonaBase * seleccion.length;

  // Bloquear si se intenta sacar a alguien que ya pagó su parte (para no perder plata de vista)
  for (const r of original) {
    const yaNoEsta = !seleccion.includes(r.cliente_id);
    if (yaNoEsta) {
      const pagado = cobros.filter((c) => c.venta_id === ventaId && c.cliente_id === r.cliente_id).reduce((s, c) => s + Number(c.monto), 0);
      if (pagado > 0) {
        alert(`No podés sacar a ${r.clientes?.nombre || "esa persona"} porque ya pagó ${fmt(pagado)} de su parte. Si fue un error, primero avisame para ver cómo revertirlo.`);
        return;
      }
    }
  }

  // Actualizar / crear / borrar filas de reparto según quién quedó
  for (let i = 0; i < seleccion.length; i++) {
    const clienteId = seleccion[i];
    const monto = porPersonaBase + (i === 0 ? resto : 0);
    const existente = original.find((r) => r.cliente_id === clienteId);
    if (existente) {
      await sb.from("venta_repartos").update({ monto }).eq("id", existente.id);
    } else {
      await sb.from("venta_repartos").insert({ venta_id: ventaId, cliente_id: clienteId, monto });
    }
  }
  for (const r of original) {
    if (!seleccion.includes(r.cliente_id)) {
      await sb.from("venta_repartos").delete().eq("id", r.id);
    }
  }

  const nombres = seleccion.map((id) => clientes.find((c) => c.id === id)?.nombre).join(", ");
  await registrarHistorial("ventas", ventaId, "editar", `División de cuenta compartida actualizada: ahora entre ${nombres}`);
  closeModal();
  await loadAll();
  if (window.__clienteDetalleId) await abrirClienteDetalle(window.__clienteDetalleId);
  else if (activeTab === "todas-ventas") await abrirTodasVentas();
  } finally {
    procesandoAccion = false;
  }
}

async function saveCobroSeleccionadas() {
  if (procesandoAccion) return;
  procesandoAccion = true;
  try {
  const medio_pago = document.getElementById("cobrosel-medio").value;
  const registrado_por = usuarios[0]?.nombre || "";
  const clienteId = window.__clienteDetalleId;
  const cliente = clientes.find((c) => c.id === clienteId);
  const filas = [...window.__clienteSeleccionadas].map((ventaId) => {
    const v = window.__clienteDetalleVentas.find((vv) => vv.id === ventaId);
    const pendiente = v.total - pagadoDeVenta(ventaId);
    return { cliente_id: clienteId, venta_id: ventaId, monto: pendiente, medio_pago, registrado_por };
  });
  const totalCobrado = filas.reduce((s, f) => s + f.monto, 0);

  for (const fila of filas) {
    const { error } = await sb.from("cobros").insert(fila);
    if (error) { alert("No se pudo registrar uno de los cobros."); console.error(error); continue; }
  }
  // Un solo movimiento de caja por todo el lote, no uno por cada deuda
  if (totalCobrado > 0) {
    await sb.from("caja_movimientos").insert({ caja_id: cajaActual.id, tipo: "cobro", monto: totalCobrado, medio_pago, descripcion: `Cobro a ${cliente?.nombre || ""} (${filas.length} deuda${filas.length>1?'s':''})` });
  }
  await registrarHistorial("cobros", clienteId, "crear", `Cobro de ${fmt(totalCobrado)} (${filas.length} ventas) a ${cliente?.nombre || ""}`);
  closeModal();
  await loadAll();
  await abrirClienteDetalle(clienteId);
  } finally {
    procesandoAccion = false;
  }
}

// Calcula ventas/ganancia/categorías en base a dinero REAL: ventas al contado + cobros de fiado
// recibidos en el período (sin importar cuándo se hizo la venta original). Misma regla que el Dashboard.
function statsCashBasis(ventasR, desde, hasta) {
  const enRango = (fecha) => { const f = new Date(fecha); return f >= desde && f < hasta; };

  const ventasContado = ventasR.filter((v) => !v.es_fiado && enRango(v.created_at));
  const cobrosEnRango = cobros.filter((c) => enRango(c.created_at));

  let totalVentas = ventasContado.reduce((s, v) => s + Number(v.total), 0);
  let totalGanancia = ventasContado.reduce((s, v) => s + (v.venta_items || []).reduce((si, it) => si + (it.subtotal - it.costo_unitario * it.cantidad), 0), 0);

  const porCategoria = {};
  ventasContado.forEach((v) => (v.venta_items || []).forEach((it) => {
    const cat = categorias.find((c) => c.id === it.productos?.categoria_id)?.nombre || "Sin categoría";
    porCategoria[cat] = (porCategoria[cat] || 0) + Number(it.subtotal);
  }));

  cobrosEnRango.forEach((c) => {
    const monto = Number(c.monto);
    totalVentas += monto;
    const venta = ventasR.find((v) => v.id === c.venta_id);
    if (venta && venta.total > 0) {
      const costoTotal = (venta.venta_items || []).reduce((s, it) => s + it.costo_unitario * it.cantidad, 0);
      const ratioGanancia = (venta.total - costoTotal) / venta.total;
      totalGanancia += monto * ratioGanancia;
      (venta.venta_items || []).forEach((it) => {
        const cat = categorias.find((cc) => cc.id === it.productos?.categoria_id)?.nombre || "Sin categoría";
        const parte = (Number(it.subtotal) / venta.total) * monto;
        porCategoria[cat] = (porCategoria[cat] || 0) + parte;
      });
    } else {
      totalGanancia += monto; // venta vieja fuera del rango cargado: se cuenta entero, sin descomponer por categoría
    }
  });

  return { totalVentas, totalGanancia, porCategoria };
}

function renderReportes(content) {
  const ventasR = window.__reportesVentas;
  const ahora = new Date();
  let desde;
  if (window.__reportesPeriodo === "semana") { desde = new Date(); desde.setDate(desde.getDate() - 7); }
  else if (window.__reportesPeriodo === "mes") { desde = new Date(); desde.setMonth(desde.getMonth() - 1); }
  else desde = new Date(2000, 0, 1);
  const hastaAhora = new Date(ahora.getTime() + 1000); // incluye este instante

  const { totalVentas, totalGanancia, porCategoria } = statsCashBasis(ventasR, desde, hastaAhora);
  const categoriasOrdenadas = Object.entries(porCategoria).sort((a, b) => b[1] - a[1]);

  // Por mes (últimos 6), también en dinero real
  const meses = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(ahora.getFullYear(), ahora.getMonth() - i, 1);
    meses.push(d);
  }
  const totalesPorMes = meses.map((m) => {
    const inicioMes = new Date(m.getFullYear(), m.getMonth(), 1);
    const finMes = new Date(m.getFullYear(), m.getMonth() + 1, 1);
    return statsCashBasis(ventasR, inicioMes, finMes).totalVentas;
  });
  const labelsMeses = meses.map((m) => m.toLocaleDateString("es-PY", { month: "short" }));

  content.innerHTML = `
    <button onclick="irA('masopciones')" class="text-[12px] text-[#6B2D5C] font-medium mb-3">‹ Volver</button>
    ${sectionLabel("Reportes")}
    <p class="text-[11px] text-[#8a7d94] mb-3">Solo cuenta dinero que ya entró (ventas al contado + fiados ya cobrados)</p>

    <div class="flex gap-2 mb-4">
      <button onclick="cambiarPeriodoReportes('semana')" class="flex-1 rounded-xl py-2 text-[12px] font-semibold ${window.__reportesPeriodo==='semana' ? 'bg-[#6B2D5C] text-white' : 'bg-white text-[#8a7d94] border border-black/[0.06]'}">Semana</button>
      <button onclick="cambiarPeriodoReportes('mes')" class="flex-1 rounded-xl py-2 text-[12px] font-semibold ${window.__reportesPeriodo==='mes' ? 'bg-[#6B2D5C] text-white' : 'bg-white text-[#8a7d94] border border-black/[0.06]'}">Último mes</button>
      <button onclick="cambiarPeriodoReportes('todo')" class="flex-1 rounded-xl py-2 text-[12px] font-semibold ${window.__reportesPeriodo==='todo' ? 'bg-[#6B2D5C] text-white' : 'bg-white text-[#8a7d94] border border-black/[0.06]'}">Todo</button>
    </div>

    <div class="grid grid-cols-2 gap-3 mb-4">
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-black/[0.04]">
        <p class="text-[11px] text-[#8a7d94] font-medium mb-1">Dinero real del período</p>
        <p class="font-mono-num text-[17px] font-semibold text-[#241C2E]">${fmt(totalVentas)}</p>
      </div>
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-black/[0.04]">
        <p class="text-[11px] text-[#8a7d94] font-medium mb-1">Ganancia real del período</p>
        <p class="font-mono-num text-[17px] font-semibold text-[#2F9E7A]">${fmt(totalGanancia)}</p>
      </div>
    </div>

    <div class="bg-white rounded-2xl p-4 shadow-sm border border-black/[0.04] mb-4">
      ${sectionLabel("Dinero real por mes (últimos 6)")}
      <div class="h-[140px]"><canvas id="reportesChart"></canvas></div>
    </div>

    <div class="bg-white rounded-2xl p-4 shadow-sm border border-black/[0.04]">
      ${sectionLabel("Por categoría (período elegido)")}
      <div class="space-y-2">
        ${categoriasOrdenadas.length === 0 ? `<p class="text-[13px] text-[#8a7d94]">Sin dinero real en este período.</p>` :
          categoriasOrdenadas.map(([cat, monto]) => `
          <div class="flex items-center justify-between text-[13px]">
            <span class="text-[#241C2E]">${cat}</span>
            <span class="font-mono-num font-semibold">${fmt(monto)}</span>
          </div>`).join("")}
      </div>
    </div>
  `;

  const ctx = document.getElementById("reportesChart");
  if (reportesChartInstance) reportesChartInstance.destroy();
  reportesChartInstance = new Chart(ctx, {
    type: "bar",
    data: { labels: labelsMeses, datasets: [{ data: totalesPorMes, backgroundColor: "#6B2D5C", borderRadius: 6 }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => fmt(c.raw) } } },
      scales: { y: { display: false }, x: { grid: { display: false } } },
    },
  });
}

  }

  const primeraCaja = todasLasCajas[0];
  let corridaEfectivo = Number(primeraCaja.apertura_efectivo || 0);
  let corridaBanco = Number(primeraCaja.apertura_banco || 0);

  const TIPO_LABEL = { venta: "Venta", cobro: "Cobro", ingreso_extra: "Ingreso extra", retiro: "Retiro", compra: "Compra" };

  // Armamos una sola línea de tiempo: apertura de la primera caja, todos sus movimientos,
  // y por cada caja siguiente marcamos dónde se reabrió (debería coincidir con el cierre anterior).
  let bloques = [];
  bloques.push({ tipo: "apertura", fecha: primeraCaja.fecha_apertura, efectivo: primeraCaja.apertura_efectivo, banco: primeraCaja.apertura_banco });

  todasLasCajas.forEach((caja, i) => {
    const movsDeEstaCaja = (todosLosMovs || []).filter((m) => m.caja_id === caja.id).sort((a, b) => new Date(a.fecha) - new Date(b.fecha));
    movsDeEstaCaja.forEach((m) => bloques.push({ tipo: "mov", data: m }));
    if (caja.estado === "cerrada") {
      bloques.push({ tipo: "cierre", fecha: caja.fecha_cierre, efectivo: caja.cierre_efectivo, banco: caja.cierre_banco });
      const siguiente = todasLasCajas[i + 1];
      if (siguiente) {
        bloques.push({ tipo: "reapertura", fecha: siguiente.fecha_apertura, efectivo: siguiente.apertura_efectivo, banco: siguiente.apertura_banco, coincide: Number(caja.cierre_efectivo) === Number(siguiente.apertura_efectivo) && Number(caja.cierre_banco) === Number(siguiente.apertura_banco) });
      }
    }
  });

  const huerfanosTotal = (todosLosMovs || []).filter((m) => m.tipo === "compra" && !m.compra_id);

  // Primero calculamos el saldo en orden cronológico (necesario para que la cuenta sea correcta)...
  const bloquesConSaldo = bloques.map((b) => {
    if (b.tipo === "mov") {
      const m = b.data;
      const monto = Number(m.monto);
      const esIngreso = m.tipo === "venta" || m.tipo === "cobro" || m.tipo === "ingreso_extra";
      const signo = esIngreso ? 1 : -1;
      const esBanco = esMedioBanco(m.medio_pago);
      if (esBanco) corridaBanco += signo * monto; else corridaEfectivo += signo * monto;
      return { ...b, signo, esBanco, saldoEfectivo: corridaEfectivo, saldoBanco: corridaBanco };
    }
    return b;
  });
  const efectivoFinal = corridaEfectivo;
  const bancoFinal = corridaBanco;

  // ...y ahora mostramos la lista con los movimientos más recientes arriba
  const filasHtml = [...bloquesConSaldo].reverse().map((b) => {
    if (b.tipo === "apertura") {
      return `<div class="bg-[#241C2E] rounded-xl p-3 text-white text-[12px]"><strong>Capital inicial</strong> · ${new Date(b.fecha).toLocaleDateString("es-PY")} — Efectivo ${fmt(b.efectivo||0)}, Banco ${fmt(b.banco||0)}</div>`;
    }
    if (b.tipo === "cierre") {
      return `<div class="bg-[#8a7d94]/10 rounded-xl p-3 text-[12px] text-[#241C2E]"><strong>Cierre de caja</strong> · ${new Date(b.fecha).toLocaleDateString("es-PY")} — quedó Efectivo ${fmt(b.efectivo||0)}, Banco ${fmt(b.banco||0)}</div>`;
    }
    if (b.tipo === "reapertura") {
      return `<div class="${b.coincide ? 'bg-[#2F9E7A]/10' : 'bg-[#D64545]/10'} rounded-xl p-3 text-[12px] text-[#241C2E]"><strong>${b.coincide ? "✓" : "⚠"} Nueva caja abierta</strong> · ${new Date(b.fecha).toLocaleDateString("es-PY")} — con Efectivo ${fmt(b.efectivo||0)}, Banco ${fmt(b.banco||0)}${!b.coincide ? " (no coincide con el cierre anterior)" : ""}</div>`;
    }
    const m = b.data;
    const monto = Number(m.monto);
    const huerfano = m.tipo === "compra" && !m.compra_id;
    return `
      <div class="bg-white rounded-xl p-3 shadow-sm border ${huerfano ? 'border-[#D64545]/40' : 'border-black/[0.04]'}">
        <div class="flex items-center justify-between">
          <span class="text-[12px] font-semibold text-[#241C2E]">${huerfano ? "⚠ " : ""}${TIPO_LABEL[m.tipo] || m.tipo} · ${b.esBanco ? "Banco" : "Efectivo"}</span>
          <span class="font-mono-num text-[12px] font-semibold ${b.signo>0?'text-[#2F9E7A]':'text-[#D64545]'}">${b.signo>0?"+":"−"}${fmt(monto)}</span>
        </div>
        <p class="text-[10px] text-[#8a7d94]">${new Date(m.fecha).toLocaleString("es-PY",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false,timeZone:"America/Asuncion"})}${m.descripcion ? " · " + m.descripcion : ""}</p>
        <p class="text-[9px] text-[#8a7d94] mt-0.5">Saldo después: efectivo ${fmt(b.saldoEfectivo)} · banco ${fmt(b.saldoBanco)}</p>
      </div>`;
  }).join("");

  content.innerHTML = `
    <button onclick="irA('masopciones')" class="text-[12px] text-[#6B2D5C] font-medium mb-3">‹ Volver</button>
    ${sectionLabel("Detalle de caja · Historial completo")}

    <div class="grid grid-cols-2 gap-3 mb-4">
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-black/[0.04]">
        <p class="text-[11px] text-[#8a7d94] font-medium mb-1">Efectivo hoy (calculado)</p>
        <p class="font-mono-num text-[17px] font-semibold text-[#241C2E]">${fmt(efectivoFinal)}</p>
      </div>
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-black/[0.04]">
        <p class="text-[11px] text-[#8a7d94] font-medium mb-1">Banco hoy (calculado)</p>
        <p class="font-mono-num text-[17px] font-semibold text-[#241C2E]">${fmt(bancoFinal)}</p>
      </div>
    </div>

    ${huerfanosTotal.length > 0 ? `
    <div class="bg-[#D64545]/10 border border-[#D64545]/25 rounded-xl p-4 mb-4">
      <p class="text-[12px] font-semibold text-[#D64545] mb-1">⚠ ${huerfanosTotal.length} movimiento(s) de compra sin compra asociada, en todo el historial</p>
      <p class="text-[11px] text-[#8a7d94]">Suman ${fmt(huerfanosTotal.reduce((s,f)=>s+Number(f.monto),0))} restados del saldo total. Es probable que sean de compras eliminadas antes de la corrección. Están marcados con ⚠ en la lista de abajo.</p>
    </div>` : ""}

    ${sectionLabel(`Todo el historial (${todasLasCajas.length} caja${todasLasCajas.length>1?'s':''} en total)`)}
    <div class="space-y-2">${filasHtml}</div>
  `;
}

function openNuevaPerdida() {
  const primero = productos.find((p) => !p.es_insumo) || productos[0];
  window.__perdidaItems = [{ producto_id: primero?.id, cantidad: 1 }];

function renderNuevaPerdidaModal() {
  const filasHtml = window.__perdidaItems.map((it, i) => `
    <div class="bg-[#F7F3FA] rounded-xl p-3 mb-2">
      <select onchange="cambiarItemPerdida(${i}, 'producto_id', this.value)" class="w-full bg-white rounded-lg px-2 py-2 text-[13px] mb-2 outline-none">
        ${productos.map((p) => `<option value="${p.id}" ${p.id===it.producto_id?"selected":""}>${p.nombre}${p.presentacion ? " · " + p.presentacion : ""}${p.es_insumo ? " (insumo)" : ""}</option>`).join("")}
      </select>
      <label class="text-[10px] text-[#8a7d94]">Cantidad</label>
      <input type="number" value="${it.cantidad}" onchange="cambiarItemPerdida(${i}, 'cantidad', this.value)" class="w-full bg-white rounded-lg px-2 py-2 text-[13px] outline-none" />
      ${window.__perdidaItems.length > 1 ? `<button onclick="quitarItemPerdida(${i})" class="text-[11px] text-[#D64545] mt-2">Quitar</button>` : ""}
    </div>
  `).join("");

  showModal(`
    <p class="font-display text-[18px] font-semibold text-[#241C2E] mb-4">Registrar pérdida</p>
    <label class="text-[11px] font-semibold uppercase tracking-wide text-[#8a7d94]">Productos perdidos</label>
    <div class="mt-2 mb-2">${filasHtml}</div>
    <button onclick="agregarItemPerdida()" class="text-[12px] text-[#6B2D5C] font-semibold mb-4">+ Agregar otro producto</button>

    <label class="text-[11px] font-semibold uppercase tracking-wide text-[#8a7d94]">Motivo (opcional)</label>
    <input id="perdida-motivo" type="text" value="${window.__perdidaMotivo}" placeholder="Ej: se rompieron, vencieron..." class="w-full bg-[#F7F3FA] rounded-xl px-3 py-2.5 text-[14px] mt-1 mb-5 outline-none" />

    <button onclick="saveNuevaPerdida()" class="w-full bg-[#D64545] text-white font-semibold rounded-xl py-3">Registrar y descontar del stock</button>
  `);
}

function cambiarItemPerdida(i, campo, valor) {
  window.__perdidaItems[i][campo] = campo === "producto_id" ? Number(valor) : Number(valor);
  renderNuevaPerdidaModal();
}
function agregarItemPerdida() {
  const primero = productos.find((p) => !p.es_insumo) || productos[0];
  window.__perdidaItems.push({ producto_id: primero?.id, cantidad: 1 });
  renderNuevaPerdidaModal();
}
function quitarItemPerdida(i) {
  window.__perdidaItems.splice(i, 1);
  renderNuevaPerdidaModal();
}

async function saveNuevaPerdida() {
  if (procesandoAccion) return;
  const motivo = document.getElementById("perdida-motivo").value.trim();

  // Validar que ningún producto quede en negativo
  for (const it of window.__perdidaItems) {
    const p = productos.find((pr) => pr.id === it.producto_id);
    if (p && it.cantidad > p.stock) {
      alert(`No hay suficiente stock de "${p.nombre}" para descontar. Disponible: ${p.stock}.`);
      return;
    }
  }

  procesandoAccion = true;
  try {
    const registrado_por = usuarios[0]?.nombre || "";
    for (const it of window.__perdidaItems) {
      const p = productos.find((pr) => pr.id === it.producto_id);
      if (!p) continue;
      await sb.from("productos").update({ stock: p.stock - it.cantidad }).eq("id", p.id);
      await sb.from("perdidas").insert({ producto_id: p.id, cantidad: it.cantidad, motivo, costo_unitario: p.costo_ultimo, registrado_por });
      await registrarHistorial("productos", p.id, "editar", `Pérdida registrada: −${it.cantidad} ${p.nombre}${motivo ? " (" + motivo + ")" : ""}`);
    }
    window.__perdidaItems = [];
    closeModal();
    await loadAll();
    await irAPerdidas();
  } finally {
    procesandoAccion = false;
  }
}

async function saveEditCategoria(id) {
  const nombre = document.getElementById("cat-editar-nombre").value.trim();
  if (!nombre) { alert("Poné un nombre."); return; }
  const { error } = await sb.from("categorias").update({ nombre }).eq("id", id);
  if (error) { alert("No se pudo guardar."); console.error(error); return; }
  await registrarHistorial("categorias", id, "editar", `Categoría renombrada a: ${nombre}`);
  closeModal();
  await loadAll();
  activeTab = "categorias";
  render();
}

async function deleteCategoria(id) {
  const c = categorias.find((cc) => cc.id === id);
  const enUsoProductos = productos.some((p) => p.categoria_id === id);
  const enUsoPromo = promociones.some((pr) => pr.categoria_id === id);
  if (enUsoProductos) {
    alert(`No podés eliminar "${c.nombre}" porque todavía hay productos usándola. Cambiales la categoría primero desde Inventario.`);
    return;
  }
  if (enUsoPromo) {
    alert(`No podés eliminar "${c.nombre}" porque hay una promoción usándola. Eliminá o cambiá esa promoción primero, en "Más → Promociones".`);
    return;
  }
  if (!confirm(`¿Eliminar la categoría "${c.nombre}"?`)) return;
  const { error } = await sb.from("categorias").delete().eq("id", id);
  if (error) { alert("No se pudo eliminar."); console.error(error); return; }
  await registrarHistorial("categorias", id, "eliminar", `Categoría eliminada: ${c.nombre}`);
  await loadAll();
  activeTab = "categorias";
  render();
}

function factorConversion(p) {
  return p?.equivalencia_bolas || 1;
}

// Consumo ilimitado reutilizable: mientras el paquete/balde esté abierto, no hay tope.
// Si no hay ninguno abierto, exige que haya al menos 1 en stock para "abrirlo".
async function validarConsumoIlimitado(producto, necesario) {
  if (!producto || necesario === 0) return { ok: true };
  const { data: fresco } = await sb.from("productos").select("stock, bolas_vendidas_actual").eq("id", producto.id).single();
  const actual = Number(fresco?.bolas_vendidas_actual || 0);
  const stockActual = Number(fresco?.stock ?? producto.stock);
  if (actual === 0 && stockActual <= 0) {
    return { ok: false, mensaje: `No hay más "${producto.presentacion || producto.nombre}" disponible. Comprá o reponé el insumo antes de usarlo.` };
  }
  return { ok: true };
}
async function aplicarConsumoIlimitado(producto, cantidadNecesaria) {
  if (!producto || cantidadNecesaria === 0) return;
  // Se trae el valor fresco de la base justo antes de decidir, para que dos ventas casi
  // simultáneas (o desde dos dispositivos) no "abran" el mismo paquete dos veces por error.
  const { data: fresco, error: errorLectura } = await sb.from("productos").select("stock, bolas_vendidas_actual").eq("id", producto.id).single();
  if (errorLectura) { console.error("No se pudo leer el estado actual de", producto.nombre, errorLectura); return; }
  const actual = Number(fresco?.bolas_vendidas_actual || 0);
  const stockActual = Number(fresco?.stock ?? producto.stock);
  let resultado;
  if (actual === 0) {
    resultado = await sb.from("productos").update({ stock: stockActual - 1, bolas_vendidas_actual: cantidadNecesaria }).eq("id", producto.id);
  } else {
    resultado = await sb.from("productos").update({ bolas_vendidas_actual: actual + cantidadNecesaria }).eq("id", producto.id);
  }
  if (resultado.error) console.error("No se pudo actualizar el consumo de", producto.nombre, resultado.error);
}

async function saveNewCompra() {
  if (procesandoAccion) return;
  const proveedor_id = Number(document.getElementById("compra-proveedor").value) || null;
  const tipo = document.getElementById("compra-tipo").value;
  const fecha = document.getElementById("compra-fecha").value;
  const created_at = fechaOAhora(fecha);
  const registrado_por = usuarios[0]?.nombre || "";
  const descuento = window.__compraDescuento || 0;
  const subtotal = window.__compraItems.reduce((s, it) => s + it.cantidad * it.costo_unitario, 0);
  const total = Math.max(0, subtotal - descuento);
  const medio_pago = window.__medioPagoCompra || "efectivo";

  let monto_efectivo = 0, monto_transferencia = 0;
  if (medio_pago === "mixto") {
    monto_efectivo = Number(document.getElementById("mixto-compra-efectivo").value) || 0;
    monto_transferencia = Number(document.getElementById("mixto-compra-transferencia").value) || 0;
    if (monto_efectivo + monto_transferencia !== total) {
      alert("El efectivo y la transferencia tienen que sumar exactamente el total de la compra.");
      return;
    }
  } else if (medio_pago === "efectivo") {
    monto_efectivo = total;
  } else {
    monto_transferencia = total;
  }

  const saldos = saldosCajaActual();
  if (monto_efectivo > saldos.efectivo) {
    alert(`No hay suficiente efectivo en caja. Disponible: ${fmt(saldos.efectivo)}, necesitás ${fmt(monto_efectivo)}.`);
    return;
  }
  if (monto_transferencia > saldos.banco) {
    alert(`No hay suficiente saldo en la cuenta bancaria. Disponible: ${fmt(saldos.banco)}, necesitás ${fmt(monto_transferencia)}.`);
    return;
  }

  procesandoAccion = true;
  try {

  const { data: compra, error } = await sb
    .from("compras")
    .insert({ proveedor_id, tipo, total, descuento, registrado_por, medio_pago, monto_efectivo, monto_transferencia, created_at })
    .select().single();
  if (error) { alert("No se pudo registrar la compra."); console.error(error); return; }

  const items = window.__compraItems.map((it) => ({ compra_id: compra.id, producto_id: it.producto_id, cantidad: it.cantidad, costo_unitario: it.costo_unitario }));
  const { error: itemsError } = await sb.from("compra_items").insert(items);
  if (itemsError) {
    alert("La compra se guardó, pero hubo un problema al guardar los productos. Abrí esta compra y volvé a cargarlos, o avisame para revisarlo.");
    console.error(itemsError);
    await registrarHistorial("compras", compra.id, "editar", `⚠ Se guardó la compra pero falló el guardado de productos — revisar`);
    window.__compraItems = [];
    closeModal();
    await loadAll();
    activeTab = "compras";
    render();
    return;
  }

  // Actualizar stock y costo_ultimo. Si el producto tiene equivalencia_bolas (ej: balde de helado),
  // la cantidad comprada se convierte a la unidad en la que se controla el stock.
  for (const it of window.__compraItems) {
    const p = productos.find((pr) => pr.id === it.producto_id);
    if (p) await sb.from("productos").update({ stock: p.stock + it.cantidad * factorConversion(p), costo_ultimo: it.costo_unitario }).eq("id", p.id);
  }

  // Descontar de la caja correspondiente
  if (monto_efectivo > 0) await sb.from("caja_movimientos").insert({ caja_id: cajaActual.id, tipo: "compra", monto: monto_efectivo, medio_pago: "efectivo", compra_id: compra.id, descripcion: `Compra #${compra.id}` });
  if (monto_transferencia > 0) await sb.from("caja_movimientos").insert({ caja_id: cajaActual.id, tipo: "compra", monto: monto_transferencia, medio_pago: "transferencia", compra_id: compra.id, descripcion: `Compra #${compra.id}` });

  window.__compraItems = [];
  closeModal();
  const proveedorNombre = proveedores.find((p) => p.id === proveedor_id)?.nombre || "sin proveedor";
  await registrarHistorial("compras", compra.id, "crear", `Compra registrada a ${proveedorNombre} por ${fmt(total)}`);
  await loadAll();
  activeTab = "compras";
  render();
  } finally {
    procesandoAccion = false;
  }
}

async function saveEditCompra() {
  if (procesandoAccion) return;
  procesandoAccion = true;
  try {
  const proveedor_id = Number(document.getElementById("compra-proveedor").value) || null;
  const tipo = document.getElementById("compra-tipo").value;
  const fecha = document.getElementById("compra-fecha").value;
  const created_at = fechaOAhora(fecha);
  const descuento = window.__compraDescuento || 0;
  const subtotal = window.__compraItems.reduce((s, it) => s + it.cantidad * it.costo_unitario, 0);
  const total = Math.max(0, subtotal - descuento);
  const compraId = window.__editingCompraId;

  // Validar antes de escribir nada: que ningún ajuste deje el stock en negativo
  for (const it of window.__compraItems) {
    const original = window.__originalCompraItems.find((o) => o.id === it.id);
    const delta = it.cantidad - (original?.cantidad || 0);
    const p = productos.find((pr) => pr.id === it.producto_id);
    if (p && p.stock + delta * factorConversion(p) < 0) {
      alert(`Ese cambio dejaría el stock de "${p.nombre}" en negativo.`);
      return;
    }
  }
  for (const original of window.__originalCompraItems) {
    const sigueExistiendo = window.__compraItems.some((it) => it.id === original.id);
    if (!sigueExistiendo) {
      const p = productos.find((pr) => pr.id === original.producto_id);
      if (p && p.stock - original.cantidad * factorConversion(p) < 0) {
        alert(`Quitar "${p.nombre}" de esta compra dejaría su stock en negativo.`);
        return;
      }
    }
  }

  // Items que ya existían: ajustar el stock por la diferencia y actualizar la fila
  for (const it of window.__compraItems) {
    if (it.id) {
      const original = window.__originalCompraItems.find((o) => o.id === it.id);
      const delta = it.cantidad - (original?.cantidad || 0);
      const p = productos.find((pr) => pr.id === it.producto_id);
      if (p) await sb.from("productos").update({ stock: p.stock + delta * factorConversion(p), costo_ultimo: it.costo_unitario }).eq("id", p.id);
      await sb.from("compra_items").update({ producto_id: it.producto_id, cantidad: it.cantidad, costo_unitario: it.costo_unitario }).eq("id", it.id);
    } else {
      // Línea nueva agregada durante la edición
      const p = productos.find((pr) => pr.id === it.producto_id);
      if (p) await sb.from("productos").update({ stock: p.stock + it.cantidad * factorConversion(p), costo_ultimo: it.costo_unitario }).eq("id", p.id);
      await sb.from("compra_items").insert({ compra_id: compraId, producto_id: it.producto_id, cantidad: it.cantidad, costo_unitario: it.costo_unitario });
    }
  }

  // Líneas que existían antes y se quitaron: revertir el stock que habían sumado
  for (const original of window.__originalCompraItems) {
    const sigueExistiendo = window.__compraItems.some((it) => it.id === original.id);
    if (!sigueExistiendo) {
      const p = productos.find((pr) => pr.id === original.producto_id);
      if (p) await sb.from("productos").update({ stock: p.stock - original.cantidad * factorConversion(p) }).eq("id", p.id);
      await sb.from("compra_items").delete().eq("id", original.id);
    }
  }

  await sb.from("compras").update({ proveedor_id, tipo, total, descuento, created_at }).eq("id", compraId);

  // Actualizar también el dinero descontado de caja, según el nuevo total
  await sb.from("caja_movimientos").delete().eq("compra_id", compraId);
  const medioEdit = window.__medioPagoCompra || "efectivo";
  let nuevoEfectivo = 0, nuevaTransferencia = 0;
  if (medioEdit === "mixto") {
    nuevoEfectivo = Number(document.getElementById("mixto-compra-efectivo")?.value) || 0;
    nuevaTransferencia = Number(document.getElementById("mixto-compra-transferencia")?.value) || 0;
  } else if (medioEdit === "efectivo") {
    nuevoEfectivo = total;
  } else {
    nuevaTransferencia = total;
  }
  if (nuevoEfectivo > 0) await sb.from("caja_movimientos").insert({ caja_id: cajaActual.id, tipo: "compra", monto: nuevoEfectivo, medio_pago: "efectivo", compra_id: compraId, descripcion: `Compra #${compraId} (editada)` });
  if (nuevaTransferencia > 0) await sb.from("caja_movimientos").insert({ caja_id: cajaActual.id, tipo: "compra", monto: nuevaTransferencia, medio_pago: "transferencia", compra_id: compraId, descripcion: `Compra #${compraId} (editada)` });
  await sb.from("compras").update({ medio_pago: medioEdit, monto_efectivo: nuevoEfectivo, monto_transferencia: nuevaTransferencia }).eq("id", compraId);

  await registrarHistorial("compras", compraId, "editar", `Compra editada, nuevo total ${fmt(total)}`);

  window.__editingCompraId = null;
  window.__compraItems = [];
  closeModal();
  await loadAll();
  activeTab = "compras";
  render();
  } finally {
    procesandoAccion = false;
  }
}

async function deleteCompra() {
  if (!confirm("¿Eliminar esta compra? Se va a descontar del stock lo que había sumado, y se devuelve el dinero a la caja.")) return;
  if (procesandoAccion) return;
  procesandoAccion = true;
  try {
  for (const it of window.__originalCompraItems) {
    const p = productos.find((pr) => pr.id === it.producto_id);
    if (p) await sb.from("productos").update({ stock: p.stock - it.cantidad * factorConversion(p) }).eq("id", p.id);
  }
  await sb.from("caja_movimientos").delete().eq("compra_id", window.__editingCompraId);
  await sb.from("compras").delete().eq("id", window.__editingCompraId);
  await registrarHistorial("compras", window.__editingCompraId, "eliminar", `Compra eliminada`);

  window.__editingCompraId = null;
  window.__compraItems = [];
  closeModal();
  await loadAll();
  activeTab = "compras";
  render();
  } finally {
    procesandoAccion = false;
  }
}

  const calculo = calcularCarritoPromos();
  const totalHelados = heladoCart.reduce((s, h) => s + h.total, 0);
  const total = calculo.total + totalHelados;

  const lineasNormales = calculo.lineas.map((l) => `
    <div class="flex items-center justify-between gap-2 bg-[#F7F3FA] rounded-xl p-3 mb-2">

  const totalHelados = heladoCart.reduce((s, h) => s + h.total, 0);

  bar.classList.remove("screen-hidden");
  bar.innerHTML = `
    <div class="flex items-center justify-between">
      <button onclick="openVerCarrito()" class="text-left">

// ---------- Armado de Helados ----------

  const baldes = baldesHelado();
  if (baldes.length === 0) { alert("Primero cargá al menos un sabor de balde de helado en Inventario."); return; }
  const cantidadFija = tipo === "pote14" ? Math.round(productoHeladoPote()?.equivalencia_bolas || 4) : 1;

    bolas: Array(cantidadFija).fill(baldes[0].id),

}

function cambiarCantidadBolas(delta) {
  const st = window.__heladoBuilder;
  const nueva = Math.max(1, st.bolas.length + delta);
  if (delta > 0) st.bolas.push(baldesHelado()[0]?.id);
  else st.bolas = st.bolas.slice(0, nueva);
  renderHeladoBuilderModal();
}
function cambiarSaborBola(index, value) {
  window.__heladoBuilder.bolas[index] = Number(value);
}
function elegirEnvase(id, btn) {
  window.__heladoBuilder.envaseId = id;
  document.querySelectorAll(".envase-btn").forEach((b) => b.classList.remove("bg-[#6B2D5C]", "text-white"));
  btn.classList.add("bg-[#6B2D5C]", "text-white");
}
function toggleCobertura(checked) {
  window.__heladoBuilder.cobertura = checked;
  renderHeladoBuilderModal();
}
function cambiarSaborCobertura(id) {
  window.__heladoBuilder.coberturaId = Number(id);
}
function toggleServilleta(checked) {

}

function agregarHeladoAlCarrito() {
  const st = window.__heladoBuilder;
  if (st.tipo === "bola" && !st.envaseId) { alert("Elegí un envase (vasito o cucurucho)."); return; }

  const producto = st.tipo === "bola" ? productoHeladoBola() : productoHeladoPote();
  const total = st.tipo === "bola" ? producto.precio_venta * st.bolas.length : producto.precio_venta;
  const nombresSabor = st.bolas.map((id) => {
    const b = productos.find((p) => p.id === id);
    return b?.presentacion || b?.nombre || "?";
  });
  const envaseNombre = st.envaseId ? productos.find((p) => p.id === st.envaseId)?.nombre : "Pote 1/4";
  const coberturaNombre = st.cobertura ? (productos.find((p) => p.id === st.coberturaId)?.presentacion || "cobertura") : "";
  const resumen = `${envaseNombre} · ${st.bolas.length} bola(s): ${nombresSabor.join(", ")}${st.cobertura ? ` · con cobertura ${coberturaNombre}` : ""}${st.servilleta ? " · con servilleta" : ""}`;

  heladoCart.push({
    id: `h${Date.now()}`,
    tipo: st.tipo,
    productoId: producto.id,
    bolas: [...st.bolas],
    envaseId: st.envaseId,
    cobertura: st.cobertura,
    coberturaId: st.cobertura ? st.coberturaId : null,
    servilleta: st.servilleta,
    total,
    resumen,
  });

  window.__heladoBuilder = null;
  closeModal();
  render();
}

function quitarHeladoCart(id) {

function changeQty(id, delta) {
  const p = productos.find((pr) => pr.id === id);
  const current = cart[id] || 0;
  cart[id] = Math.max(0, Math.min(p.stock, current + delta));
  if (cart[id] === 0) delete pajitasCart[id];
  render();
}

function togglePajita(id, checked, qty) {
  if (checked) pajitasCart[id] = qty;
  else delete pajitasCart[id];
  render();
}
function changePajitaCantidad(id, delta) {
  const actual = pajitasCart[id] || 0;
  const nueva = Math.max(1, actual + delta);
  pajitasCart[id] = nueva;
  render();
}

async function crearClienteRapido() {
  const nombre = document.getElementById("alta-rapida-nombre").value.trim();
  if (!nombre) { alert("Poné un nombre."); return; }
  const { data, error } = await sb.from("clientes").insert({ nombre }).select().single();
  if (error) { alert("No se pudo crear el cliente."); console.error(error); return; }
  await registrarHistorial("clientes", data.id, "crear", `Cliente creado: ${nombre}`);
  clientes.push(data);
  window.__clienteRecienCreado = data.id;
  renderConfirmSaleModal();
}

function toggleFiado(checked) {
  const wrap = document.getElementById("medio-pago-wrap");
  if (checked) wrap.classList.add("screen-hidden");
  else wrap.classList.remove("screen-hidden");
}

function selectPago(medio, btn) {
  window.__medioPago = medio;
  document.querySelectorAll(".pago-btn").forEach((b) => b.classList.remove("bg-[#6B2D5C]", "text-white"));
  btn.classList.add("bg-[#6B2D5C]", "text-white");

  if (medio === "mixto") {
    mixtoWrap.classList.remove("hidden");
    actualizarRestoMixto();
  } else {
    mixtoWrap.classList.add("hidden");
  }
