<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CG Dulces · Panel del negocio</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

  .font-display { font-family: 'Fraunces', serif; }
  .font-mono-num { font-family: 'IBM Plex Mono', monospace; }
  .tab-btn.active svg { color:#6B2D5C; }
  .tab-btn.active span { color:#6B2D5C; font-weight:600; }
  .tab-btn svg, .tab-btn span { color:#b3a6bd; }
  .stock-fill { transition: width .4s ease; }
  .modal-overlay { background: rgba(36,28,46,0.55); }
  .screen-hidden { display: none !important; }
  html, body { touch-action: manipulation; }
</style>
</head>
<body class="min-h-screen w-full flex items-start justify-center p-0 sm:p-4">
 
<!-- Pantalla de login -->
<div id="login-screen" class="relative w-full max-w-[460px] md:max-w-none lg:max-w-[1100px] sm:h-[860px] md:h-[90vh] sm:rounded-[2.25rem] sm:shadow-2xl sm:border sm:border-black/5 bg-[#F7F3FA] overflow-hidden flex flex-col min-h-screen">
  <div class="flex-1 flex flex-col items-center justify-center px-8">
    <p class="font-display text-[28px] font-semibold text-[#6B2D5C] mb-1">CG Dulces</p>
    <p class="text-[13px] text-[#8a7d94] mb-8">Ingresá para ver el panel del negocio</p>
    <form id="login-form" class="w-full space-y-3">
      <input id="login-email" type="text" required placeholder="Usuario" autocomplete="username"
        class="w-full bg-white rounded-xl px-4 py-3 text-[14px] border border-black/[0.06] outline-none focus:border-[#6B2D5C]" />
      <input id="login-password" type="password" required placeholder="Contraseña" autocomplete="current-password"
        class="w-full bg-white rounded-xl px-4 py-3 text-[14px] border border-black/[0.06] outline-none focus:border-[#6B2D5C]" />
      <button type="submit" class="w-full bg-[#6B2D5C] text-white text-[14px] font-semibold rounded-xl py-3 active:scale-[0.98] transition-transform">
        Entrar
      </button>
      <p id="login-error" class="hidden text-[12px] text-[#D64545] text-center pt-1">Usuario o contraseña incorrectos.</p>
    </form>
  </div>
</div>
 
<!-- App -->
<div id="app-screen" class="screen-hidden relative w-full max-w-[460px] md:max-w-none lg:max-w-[1100px] sm:h-[860px] md:h-[90vh] sm:rounded-[2.25rem] sm:shadow-2xl sm:border sm:border-black/5 bg-[#F7F3FA] overflow-hidden flex flex-col min-h-screen">
 
  <!-- Encabezado -->
  <div class="px-6 pt-6 pb-4 bg-[#6B2D5C] text-white shrink-0">
    <div class="flex items-center justify-between">
      <div>
        <p class="font-display text-[22px] font-semibold leading-tight">CG Dulces</p>
        <p class="text-[12px] text-white/70">Panel del negocio</p>
      </div>
      <div class="flex items-center gap-2">
        <button id="logout-btn" class="text-[11px] text-white/70 underline">Salir</button>
      </div>
    </div>
  </div>
 
  <!-- Contenido -->
  <div id="content" class="flex-1 overflow-y-auto px-5 pb-4 pt-5">
    <p class="text-center text-[13px] text-[#8a7d94] pt-10">Cargando...</p>
  </div>
 
  <!-- Carrito flotante -->
  <div id="cart-bar" class="screen-hidden absolute bottom-[86px] left-4 right-4 bg-[#241C2E] rounded-2xl px-4 py-3 shadow-xl"></div>
 
  <!-- Botón flotante agregar producto -->
  <button id="add-product-fab" class="screen-hidden absolute bottom-[96px] right-4 w-12 h-12 rounded-full bg-[#6B2D5C] text-white text-[22px] shadow-xl items-center justify-center">+</button>
 
  <!-- Navegación inferior -->
  <div class="shrink-0 bg-white border-t border-black/[0.06] px-6 pt-2 pb-3">
    <div class="flex items-center justify-around">
      <button class="tab-btn flex flex-col items-center gap-1 py-1 px-3" data-tab="dashboard">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
        <span class="text-[10px]">Panel</span>
      </button>
      <button class="tab-btn flex flex-col items-center gap-1 py-1 px-3" data-tab="vender">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <span class="text-[10px]">Vender</span>
      </button>
      <button class="tab-btn flex flex-col items-center gap-1 py-1 px-3" data-tab="inventario">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8V21H3V8"/><path d="M1 3h22v5H1z"/><path d="M10 12h4"/></svg>
        <span class="text-[10px]">Inventario</span>
      </button>
      <button class="tab-btn flex flex-col items-center gap-1 py-1 px-3" data-tab="mas">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
        <span class="text-[10px]">Más</span>
      </button>
    </div>
    <div class="w-32 h-1 bg-[#241C2E]/15 rounded-full mx-auto mt-2.5"></div>
  </div>
</div>
 
<!-- Modal genérico (editar / crear producto / confirmar venta) -->
<div id="modal-overlay" class="screen-hidden fixed inset-0 modal-overlay items-end sm:items-center justify-center z-50 p-0 sm:p-4">
  <div id="modal-box" class="bg-white w-full sm:max-w-[420px] sm:rounded-2xl rounded-t-2xl p-5 max-h-[85vh] overflow-y-auto"></div>
</div>
 
<script>
// ---------- Conexión a Supabase ----------
const SUPABASE_URL = "https://amfcmrvksewtqqadiuii.supabase.co";
const SUPABASE_KEY = "sb_publishable_oVCLDcffzu2l2aQxLzcexg_jbzsDaUi";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
 
const PALETTE = ["#6B2D5C","#F2994A","#2F9E7A","#D6608A","#8A4B2E","#D9A441","#4A7C9E","#7C5C9E"];
const HELADOS_OCULTO = "Helados"; // se habilita en la próxima etapa
 
let categorias = [];
let productos = [];
let promociones = [];
let usuarios = [];
let ventasHistoricas = [];
let proveedores = [];
let compras = [];
let clientes = [];
let ventasClientes = [];
let cobros = [];
let cart = {};
let heladoCart = []; // ventas armadas de helado: { id, tipo: 'bola'|'pote14', bolas: [productoId,...], envaseId, cobertura, total }
let activeTab = "dashboard";
let chartInstance = null;
let categoryColors = {};
 
const fmt = (n) => `Gs. ${Math.round(n).toLocaleString("es-PY")}`;
 
// ---------- Autenticación ----------
async function checkSession() {
  const { data } = await sb.auth.getSession();
  if (data.session) showApp(); else showLogin();
}
function showLogin() {
  document.getElementById("login-screen").classList.remove("screen-hidden");
  document.getElementById("app-screen").classList.add("screen-hidden");
}
function showApp() {
  document.getElementById("login-screen").classList.add("screen-hidden");
  document.getElementById("app-screen").classList.remove("screen-hidden");
  loadAll();
}
document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const usuario = document.getElementById("login-email").value.trim().toLowerCase();
  const password = document.getElementById("login-password").value;
  const errorMsg = document.getElementById("login-error");
  errorMsg.classList.add("hidden");
  const email = `${usuario}@cgdulces.local`;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { errorMsg.classList.remove("hidden"); return; }
  showApp();
});
document.getElementById("logout-btn").addEventListener("click", async () => {
  await sb.auth.signOut();
  showLogin();
});
 
// ---------- Carga de datos ----------
async function loadAll() {
  await Promise.all([loadCategorias(), loadProductos(), loadPromociones(), loadUsuarios(), loadVentas(), loadProveedores(), loadCompras(), loadClientes(), loadVentasClientes(), loadCobros()]);
  render();
}
 
async function loadClientes() {
  const { data, error } = await sb.from("clientes").select("*").order("nombre");
  if (error) { console.error(error); return; }
  clientes = data;
}
 
async function loadVentasClientes() {
  const { data, error } = await sb.from("ventas").select("cliente_id, total, es_fiado, created_at").not("cliente_id", "is", null);
  if (error) { console.error(error); return; }
  ventasClientes = data;
}
 
async function loadCobros() {
  const { data, error } = await sb.from("cobros").select("*").order("created_at", { ascending: false });
  if (error) { console.error(error); return; }
  cobros = data;
}
 
async function loadProveedores() {
  const { data, error } = await sb.from("proveedores").select("*").order("nombre");
  if (error) { console.error(error); return; }
  proveedores = data;
}
 
async function loadCompras() {
  const { data, error } = await sb
    .from("compras")
    .select("id, proveedor_id, tipo, total, comprobante_url, registrado_por, created_at, proveedores(nombre), compra_items(id, producto_id, cantidad, costo_unitario, productos(nombre, presentacion))")
    .order("created_at", { ascending: false })
    .limit(30);
  if (error) { console.error(error); return; }
  compras = data;
}
 
async function loadCategorias() {
  const { data, error } = await sb.from("categorias").select("*").order("nombre");
  if (error) { console.error(error); return; }
  categorias = data;
  categorias.forEach((c, i) => (categoryColors[c.nombre] = PALETTE[i % PALETTE.length]));
}
 
async function loadProductos() {
  const { data, error } = await sb
    .from("productos")
    .select("*, categorias(nombre)")
    .eq("activo", true)
    .order("nombre");
  if (error) { console.error(error); return; }
  productos = data;
}
 
async function loadPromociones() {
  const { data, error } = await sb.from("promociones").select("*").eq("activo", true);
  if (error) { console.error(error); return; }
  promociones = data;
}
 
async function loadUsuarios() {
  const { data, error } = await sb.from("usuarios_app").select("*").order("nombre");
  if (error) { console.error(error); return; }
  usuarios = data;
}
 
async function loadVentas() {
  const { data, error } = await sb
    .from("ventas")
    .select("id, total, subtotal, descuento_total, medio_pago, registrado_por, created_at, venta_items(cantidad, precio_unitario, costo_unitario, subtotal, producto_id, productos(nombre))")
    .order("created_at", { ascending: false })
    .limit(60);
  if (error) { console.error(error); return; }
  ventasHistoricas = data;
}
 
// ---------- Utilidades ----------
function ventasVisibles() {
  return productos.filter((p) => !p.es_insumo && p.categorias?.nombre !== HELADOS_OCULTO);
}
 
function baldesHelado() {
  return productos.filter((p) => p.producto_base === "Balde Helado");
}
function insumoPorNombre(nombre) {
  return productos.find((p) => p.nombre === nombre && p.es_insumo);
}
function productoHeladoBola() {
  return productos.find((p) => p.nombre === "Helado · Bola");
}
function productoHeladoPote() {
  return productos.find((p) => p.nombre === "Helado · Pote 1/4");
}
 
function promoParaProducto(producto) {
  if (!producto) return null;
  return promociones.find((pr) => pr.categoria_id && pr.categoria_id === producto.categoria_id)
    || promociones.find((pr) => pr.producto_id === producto.id);
}
 
function cantidadGrupoEnCarrito(promo) {
  return productos
    .filter((p) => promoParaProducto(p)?.id === promo.id)
    .reduce((s, p) => s + (cart[p.id] || 0), 0);
}
 
// Calcula todas las líneas del carrito aplicando promociones que combinan
// productos de la misma categoría (ej: 2 alfajores de sabores distintos)
function calcularCarritoPromos() {
  const entradas = Object.entries(cart)
    .filter(([, q]) => q > 0)
    .map(([id, q]) => ({ producto: productos.find((p) => p.id === Number(id)), cantidad: q }));
 
  const grupos = {};
  entradas.forEach(({ producto, cantidad }) => {
    const promo = promoParaProducto(producto);
    const key = promo ? `promo-${promo.id}` : `solo-${producto.id}`;
    if (!grupos[key]) grupos[key] = { promo, items: [] };
    grupos[key].items.push({ producto, cantidad });
  });
 
  const lineas = [];
  let subtotalTotal = 0, descuentoTotal = 0;
 
  Object.values(grupos).forEach((g) => {
    const totalQty = g.items.reduce((s, it) => s + it.cantidad, 0);
    const normalTotal = g.items.reduce((s, it) => s + it.producto.precio_venta * it.cantidad, 0);
 
    if (g.promo && totalQty >= g.promo.cantidad_requerida) {
      const gruposCompletos = Math.floor(totalQty / g.promo.cantidad_requerida);
      const resto = totalQty % g.promo.cantidad_requerida;
      const precioPromedio = normalTotal / totalQty;
      const promoTotal = gruposCompletos * g.promo.precio_promocional + resto * precioPromedio;
      const descuento = normalTotal - promoTotal;
 
      g.items.forEach((it) => {
        const parteNormal = it.producto.precio_venta * it.cantidad;
        const parteDescuento = normalTotal > 0 ? descuento * (parteNormal / normalTotal) : 0;
        lineas.push({ producto: it.producto, cantidad: it.cantidad, subtotal: parteNormal - parteDescuento, descuento: parteDescuento });
        subtotalTotal += parteNormal;
        descuentoTotal += parteDescuento;
      });
    } else {
      g.items.forEach((it) => {
        const subtotal = it.producto.precio_venta * it.cantidad;
        lineas.push({ producto: it.producto, cantidad: it.cantidad, subtotal, descuento: 0 });
        subtotalTotal += subtotal;
      });
    }
  });
 
  return { lineas, subtotalTotal, descuentoTotal, total: subtotalTotal - descuentoTotal };
}
 
function isSameDay(dateStr, ref) {
  return new Date(dateStr).toDateString() === ref.toDateString();
}
 
function todayStats() {
  const today = new Date();
  const of = ventasHistoricas.filter((v) => isSameDay(v.created_at, today));
  const total = of.reduce((s, v) => s + Number(v.total), 0);
  const ganancia = of.reduce((s, v) => {
    const g = (v.venta_items || []).reduce((si, it) => si + it.subtotal, 0);
    return s + g;
  }, 0);
  const gananciaReal = of.reduce((s, v) => {
    const g = (v.venta_items || []).reduce((si, it) => si + (it.subtotal - it.costo_unitario * it.cantidad), 0);
    return s + g;
  }, 0);
  return { total, ganancia, gananciaReal };
}
 
function last7DaysChartData() {
  const labels = ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
  const days = [];
  for (let i = 6; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); days.push(d); }
  const totals = days.map((d) => ventasHistoricas.filter((v) => isSameDay(v.created_at, d)).reduce((s, v) => s + Number(v.total), 0));
  const dayLabels = days.map((d) => labels[(d.getDay() + 6) % 7]);
  return { dayLabels, totals };
}
 
function topProductName() {
  const counts = {};
  ventasHistoricas.forEach((v) => (v.venta_items || []).forEach((it) => {
    const name = it.productos?.nombre || "—";
    counts[name] = (counts[name] || 0) + Number(it.cantidad);
  }));
  const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  return sorted.length ? sorted[0][0] : "—";
}
 
function agruparPorCategoria(lista) {
  const grupos = {};
  lista.forEach((p) => {
    const cat = p.categorias?.nombre || "Sin categoría";
    if (!grupos[cat]) grupos[cat] = [];
    grupos[cat].push(p);
  });
  return grupos;
}
 
function sectionLabel(text) {
  return `<p class="text-[11px] font-semibold uppercase tracking-[0.14em] text-[#8a7d94] mb-2">${text}</p>`;
}
 
// ---------- Render principal ----------
function render() {
  const content = document.getElementById("content");
  const submodulos = ["mas", "proveedores", "compras", "clientes", "cliente-detalle"];
  const grupoActivo = submodulos.includes(activeTab) ? "mas" : activeTab;
  document.querySelectorAll(".tab-btn").forEach((b) => b.classList.toggle("active", b.dataset.tab === grupoActivo));
  document.getElementById("add-product-fab").classList.toggle("screen-hidden", activeTab !== "inventario");
  document.getElementById("add-product-fab").classList.toggle("flex", activeTab === "inventario");
 
  if (activeTab === "dashboard") renderDashboard(content);
  if (activeTab === "vender") renderVender(content);
  if (activeTab === "inventario") renderInventario(content);
  if (activeTab === "mas") renderMas(content);
  if (activeTab === "proveedores") renderProveedores(content);
  if (activeTab === "clientes") renderClientes(content);
  if (activeTab === "cliente-detalle") renderClienteDetalle(content);
  if (activeTab === "compras") renderCompras(content);
  renderCartBar();
}
 
function renderDashboard(content) {
  const { total, ganancia, gananciaReal } = todayStats();
  const lowStock = productos.filter((p) => !p.es_insumo && p.nombre !== "Helado · Bola" && p.nombre !== "Helado · Pote 1/4" && p.stock <= p.stock_minimo);
  const recientes = ventasHistoricas.slice(0, 4);
 
  content.innerHTML = `
    <div class="space-y-5">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-black/[0.04]">
          <p class="text-[11px] text-[#8a7d94] font-medium mb-1">Ventas de hoy</p>
          <p class="font-mono-num text-[19px] font-semibold text-[#241C2E]">${fmt(total)}</p>
        </div>
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-black/[0.04]">
          <p class="text-[11px] text-[#8a7d94] font-medium mb-1">Ganancia de hoy</p>
          <p class="font-mono-num text-[19px] font-semibold text-[#2F9E7A]">${fmt(ganancia)}</p>
        </div>
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-black/[0.04]">
          <p class="text-[11px] text-[#8a7d94] font-medium mb-1">Stock bajo</p>
          <p class="font-mono-num text-[19px] font-semibold text-[#D64545]">${lowStock.length} productos</p>
        </div>
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-black/[0.04]">
          <p class="text-[11px] text-[#8a7d94] font-medium mb-1">Más vendido</p>
          <p class="text-[13px] font-semibold text-[#241C2E] leading-tight mt-1.5">${topProductName()}</p>
        </div>
      </div>
 
      <div class="bg-[#2F9E7A]/10 border border-[#2F9E7A]/25 rounded-xl px-4 py-2.5 flex items-center justify-between">
        <span class="text-[10px] font-semibold text-[#2F9E7A] uppercase tracking-wide">Ganancia real de hoy (venta − costo)</span>
        <span class="font-mono-num text-[15px] font-bold text-[#2F9E7A]">${fmt(gananciaReal)}</span>
      </div>
 
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-black/[0.04]">
        ${sectionLabel("Ventas de la semana")}
        <div class="h-[140px]"><canvas id="weekChart"></canvas></div>
      </div>
 
      ${lowStock.length ? `
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-black/[0.04]">
        ${sectionLabel("Necesitan reposición")}
        <div class="space-y-2.5">
          ${lowStock.map((p) => `
            <div class="flex items-center justify-between text-[13px]">
              <span class="text-[#241C2E] font-medium">${p.nombre}${p.presentacion ? " · " + p.presentacion : ""}</span>
              <span class="font-mono-num text-[#D64545]">${p.stock} u.</span>
            </div>`).join("")}
        </div>
      </div>` : ""}
 
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-black/[0.04]">
        ${sectionLabel("Últimas ventas")}
        <div class="space-y-3">
          ${recientes.length === 0 ? `<p class="text-[13px] text-[#8a7d94]">Todavía no hay ventas registradas.</p>` :
            recientes.map((v) => `
            <div class="flex items-center justify-between gap-3">
              <div class="min-w-0">
                <p class="text-[13px] text-[#241C2E] truncate">${(v.venta_items||[]).map(it=>`${it.cantidad}× ${it.productos?.nombre||""}`).join(", ")}</p>
                <p class="text-[11px] text-[#8a7d94]">${new Date(v.created_at).toLocaleTimeString("es-PY",{hour:"2-digit",minute:"2-digit"})} · ${v.registrado_por || ""}</p>
              </div>
              <span class="font-mono-num text-[13px] font-semibold shrink-0">${fmt(v.total)}</span>
            </div>`).join("")}
        </div>
      </div>
    </div>
  `;
 
  const { dayLabels, totals } = last7DaysChartData();
  const ctx = document.getElementById("weekChart");
  if (chartInstance) chartInstance.destroy();
  chartInstance = new Chart(ctx, {
    type: "bar",
    data: { labels: dayLabels, datasets: [{ data: totals, backgroundColor: "#6B2D5C", borderRadius: 6 }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => fmt(c.raw) } } },
      scales: { y: { display: false }, x: { grid: { display: false } } },
    },
  });
}
 
function renderVender(content) {
  const grupos = agruparPorCategoria(ventasVisibles());
  let html = Object.entries(grupos).map(([cat, lista]) => `
    <div class="mb-5">
      ${sectionLabel(cat)}
      <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
        ${lista.map((p) => {
          const qty = cart[p.id] || 0;

function deudaCliente(clienteId) {
  const vendido = ventasClientes.filter((v) => v.cliente_id === clienteId && v.es_fiado).reduce((s, v) => s + Number(v.total), 0);
  const pagado = cobros.filter((c) => c.cliente_id === clienteId).reduce((s, c) => s + Number(c.monto), 0);
  return vendido - pagado;
}
function totalCompradoCliente(clienteId) {
  return ventasClientes.filter((v) => v.cliente_id === clienteId).reduce((s, v) => s + Number(v.total), 0);
}
 
function renderClientes(content) {
  const ordenados = [...clientes].sort((a, b) => totalCompradoCliente(b.id) - totalCompradoCliente(a.id));
  content.innerHTML = `

        }).join("")}

window.__clienteDetalleId = null;
window.__clienteDetalleVentas = [];
window.__clienteDetalleCobros = [];
window.__clienteSeleccionadas = new Set();
 
async function abrirClienteDetalle(clienteId) {
  window.__clienteDetalleId = clienteId;
  window.__clienteSeleccionadas = new Set();
  const [{ data: ventasCliente }, { data: cobrosCliente }] = await Promise.all([
    sb.from("ventas").select("id, total, es_fiado, medio_pago, created_at, venta_items(cantidad, productos(nombre))").eq("cliente_id", clienteId).order("created_at", { ascending: false }),
    sb.from("cobros").select("*").eq("cliente_id", clienteId).order("created_at", { ascending: false }),
  ]);
  window.__clienteDetalleVentas = ventasCliente || [];
  window.__clienteDetalleCobros = cobrosCliente || [];
  activeTab = "cliente-detalle";
  render();
}
 
function pagadoDeVenta(ventaId) {
  return window.__clienteDetalleCobros.filter((c) => c.venta_id === ventaId).reduce((s, c) => s + Number(c.monto), 0);
}
 
function renderClienteDetalle(content) {
  const cliente = clientes.find((c) => c.id === window.__clienteDetalleId);
  if (!cliente) { content.innerHTML = ""; return; }
  const ventas = window.__clienteDetalleVentas;
  const deudaTotal = deudaCliente(cliente.id);
 
  content.innerHTML = `
    <button onclick="irA('clientes')" class="text-[12px] text-[#6B2D5C] font-medium mb-3">‹ Volver a Clientes</button>
    <div class="bg-white rounded-2xl p-4 shadow-sm border border-black/[0.04] mb-4">
      <p class="font-display text-[18px] font-semibold text-[#241C2E]">${cliente.nombre}</p>
      <p class="text-[13px] mt-1 ${deudaTotal > 0 ? 'text-[#D64545] font-semibold' : 'text-[#2F9E7A] font-semibold'}">${deudaTotal > 0 ? `Debe en total ${fmt(deudaTotal)}` : "Sin deuda pendiente"}</p>
    </div>
 
    ${sectionLabel("Historial de compras")}
    <div class="space-y-2 mb-4">
      ${ventas.length === 0 ? `<p class="text-[13px] text-[#8a7d94]">Todavía no tiene compras registradas.</p>` :
        ventas.map((v) => {
          const pagado = pagadoDeVenta(v.id);
          const pendiente = v.es_fiado ? Math.max(0, v.total - pagado) : 0;
          const fechaHora = new Date(v.created_at).toLocaleString("es-PY", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
          const itemsTexto = (v.venta_items || []).map((it) => `${it.cantidad}× ${it.productos?.nombre || ""}`).join(", ");
          const seleccionable = v.es_fiado && pendiente > 0;
          return `
          <div class="bg-white rounded-2xl p-4 shadow-sm border border-black/[0.04]">
            <div class="flex items-start gap-2.5">
              ${seleccionable ? `<input type="checkbox" onchange="toggleSeleccionVenta(${v.id}, this.checked)" ${window.__clienteSeleccionadas.has(v.id) ? "checked" : ""} class="w-4 h-4 mt-0.5 shrink-0" />` : `<span class="w-4 shrink-0"></span>`}
              <div class="flex-1 min-w-0">
                <div class="flex items-center justify-between gap-2">
                  <span class="text-[11px] text-[#8a7d94]">${fechaHora}</span>
                  <span class="font-mono-num text-[13px] font-semibold">${fmt(v.total)}</span>
                </div>
                <p class="text-[13px] text-[#241C2E] mt-0.5">${itemsTexto}</p>
                <div class="flex items-center justify-between mt-1.5">
                  ${!v.es_fiado
                    ? `<span class="text-[11px] text-[#8a7d94]">Pagado al contado (${v.medio_pago})</span>`
                    : pendiente <= 0
                      ? `<span class="text-[11px] text-[#2F9E7A] font-semibold">✓ Pagado</span>`
                      : `<span class="text-[11px] text-[#D64545] font-semibold">Pendiente ${fmt(pendiente)}</span>`}
                  ${seleccionable ? `<button onclick="openCobroVenta(${v.id})" class="text-[11px] text-[#6B2D5C] font-semibold">Cobrar esta</button>` : ""}
                </div>
              </div>
            </div>
          </div>`;
        }).join("")}
    </div>
  `;
 
  if (window.__clienteSeleccionadas.size > 0) {
    const totalSeleccion = [...window.__clienteSeleccionadas].reduce((s, id) => {
      const v = ventas.find((vv) => vv.id === id);
      return s + (v.total - pagadoDeVenta(id));
    }, 0);
    content.innerHTML += `
      <div class="bg-[#241C2E] rounded-2xl px-4 py-3 flex items-center justify-between sticky bottom-0">
        <div>
          <p class="text-white/60 text-[11px]">${window.__clienteSeleccionadas.size} venta(s) elegidas</p>
          <p class="text-white font-mono-num text-[15px] font-semibold">${fmt(totalSeleccion)}</p>
        </div>
        <button onclick="openCobroSeleccionadas()" class="bg-[#2F9E7A] text-white text-[12px] font-semibold px-3.5 py-2.5 rounded-xl">Cobrar seleccionadas</button>
      </div>
    `;
  }
}
 
function toggleSeleccionVenta(ventaId, checked) {
  if (checked) window.__clienteSeleccionadas.add(ventaId);
  else window.__clienteSeleccionadas.delete(ventaId);
  render();
}

  const v = window.__clienteDetalleVentas.find((vv) => vv.id === ventaId);

  `);
}

async function saveCobroSeleccionadas() {
  const medio_pago = document.getElementById("cobrosel-medio").value;
  const registrado_por = usuarios[0]?.nombre || "";
  const clienteId = window.__clienteDetalleId;
  const filas = [...window.__clienteSeleccionadas].map((ventaId) => {
    const v = window.__clienteDetalleVentas.find((vv) => vv.id === ventaId);
    const pendiente = v.total - pagadoDeVenta(ventaId);
    return { cliente_id: clienteId, venta_id: ventaId, monto: pendiente, medio_pago, registrado_por };
  });
  const { error } = await sb.from("cobros").insert(filas);
  if (error) { alert("No se pudo registrar el cobro."); console.error(error); return; }
  closeModal();
  await loadAll();
  await abrirClienteDetalle(clienteId);
}

function factorConversion(p) {
  return p?.equivalencia_bolas || 1;
}
 
async function saveNewCompra() {
  const proveedor_id = Number(document.getElementById("compra-proveedor").value) || null;
  const tipo = document.getElementById("compra-tipo").value;
  const registrado_por = usuarios[0]?.nombre || "";
  const total = window.__compraItems.reduce((s, it) => s + it.cantidad * it.costo_unitario, 0);
 
  const { data: compra, error } = await sb
    .from("compras")
    .insert({ proveedor_id, tipo, total, registrado_por })
    .select().single();
  if (error) { alert("No se pudo registrar la compra."); console.error(error); return; }
 
  const items = window.__compraItems.map((it) => ({ compra_id: compra.id, producto_id: it.producto_id, cantidad: it.cantidad, costo_unitario: it.costo_unitario }));
  await sb.from("compra_items").insert(items);
 
  // Actualizar stock y costo_ultimo. Si el producto tiene equivalencia_bolas (ej: balde de helado),
  // la cantidad comprada se convierte a la unidad en la que se controla el stock.
  for (const it of window.__compraItems) {
    const p = productos.find((pr) => pr.id === it.producto_id);
    if (p) await sb.from("productos").update({ stock: p.stock + it.cantidad * factorConversion(p), costo_ultimo: it.costo_unitario }).eq("id", p.id);
  }
 
  window.__compraItems = [];
  closeModal();
  await loadAll();
  activeTab = "compras";
  render();
}
 
async function saveEditCompra() {
  const proveedor_id = Number(document.getElementById("compra-proveedor").value) || null;
  const tipo = document.getElementById("compra-tipo").value;
  const total = window.__compraItems.reduce((s, it) => s + it.cantidad * it.costo_unitario, 0);
  const compraId = window.__editingCompraId;
 
  // Items que ya existían: ajustar el stock por la diferencia y actualizar la fila
  for (const it of window.__compraItems) {
    if (it.id) {
      const original = window.__originalCompraItems.find((o) => o.id === it.id);
      const delta = it.cantidad - (original?.cantidad || 0);
      const p = productos.find((pr) => pr.id === it.producto_id);
      if (p) await sb.from("productos").update({ stock: p.stock + delta * factorConversion(p), costo_ultimo: it.costo_unitario }).eq("id", p.id);
      await sb.from("compra_items").update({ producto_id: it.producto_id, cantidad: it.cantidad, costo_unitario: it.costo_unitario }).eq("id", it.id);
    } else {
      // Línea nueva agregada durante la edición
      const p = productos.find((pr) => pr.id === it.producto_id);
      if (p) await sb.from("productos").update({ stock: p.stock + it.cantidad * factorConversion(p), costo_ultimo: it.costo_unitario }).eq("id", p.id);
      await sb.from("compra_items").insert({ compra_id: compraId, producto_id: it.producto_id, cantidad: it.cantidad, costo_unitario: it.costo_unitario });
    }
  }
 
  // Líneas que existían antes y se quitaron: revertir el stock que habían sumado
  for (const original of window.__originalCompraItems) {
    const sigueExistiendo = window.__compraItems.some((it) => it.id === original.id);
    if (!sigueExistiendo) {
      const p = productos.find((pr) => pr.id === original.producto_id);
      if (p) await sb.from("productos").update({ stock: p.stock - original.cantidad * factorConversion(p) }).eq("id", p.id);
      await sb.from("compra_items").delete().eq("id", original.id);
    }
  }
 
  await sb.from("compras").update({ proveedor_id, tipo, total }).eq("id", compraId);
 
  window.__editingCompraId = null;
  window.__compraItems = [];
  closeModal();
  await loadAll();
  activeTab = "compras";
  render();
}
 
async function deleteCompra() {
  if (!confirm("¿Eliminar esta compra? Se va a descontar del stock lo que había sumado.")) return;
  for (const it of window.__originalCompraItems) {
    const p = productos.find((pr) => pr.id === it.producto_id);
    if (p) await sb.from("productos").update({ stock: p.stock - it.cantidad * factorConversion(p) }).eq("id", p.id);
  }
  await sb.from("compras").delete().eq("id", window.__editingCompraId);
 
  window.__editingCompraId = null;
  window.__compraItems = [];
  closeModal();
  await loadAll();
  activeTab = "compras";
  render();
}

    <label class="text-[11px] font-semibold uppercase tracking-wide text-[#8a7d94]">Cliente (opcional)</label>
    <select id="venta-cliente" class="w-full bg-[#F7F3FA] rounded-xl px-3 py-2.5 text-[14px] mt-1 mb-3 outline-none">
      <option value="">Sin cliente</option>
      ${opcionesCliente}
    </select>
 
    <label class="flex items-center gap-2 mb-4">
      <input type="checkbox" id="venta-fiado" onchange="toggleFiado(this.checked)" class="w-4 h-4" />
      <span class="text-[13px] text-[#241C2E]">Es fiado (queda a cuenta del cliente)</span>
    </label>
 
    <div id="medio-pago-wrap">
      <label class="text-[11px] font-semibold uppercase tracking-wide text-[#8a7d94]">Medio de pago</label>
      <div class="grid grid-cols-3 gap-2 mt-1 mb-4">
        <button type="button" onclick="selectPago('efectivo', this)" class="pago-btn border border-black/10 rounded-xl py-2 text-[12px] font-medium bg-[#6B2D5C] text-white" data-pago="efectivo">Efectivo</button>
        <button type="button" onclick="selectPago('transferencia', this)" class="pago-btn border border-black/10 rounded-xl py-2 text-[12px] font-medium" data-pago="transferencia">Transf.</button>
        <button type="button" onclick="selectPago('qr', this)" class="pago-btn border border-black/10 rounded-xl py-2 text-[12px] font-medium" data-pago="qr">QR</button>
      </div>
    </div>
 
    <label class="text-[11px] font-semibold uppercase tracking-wide text-[#8a7d94]">Registrado por</label>
    <select id="registrado-por" class="w-full bg-[#F7F3FA] rounded-xl px-3 py-2.5 text-[14px] mt-1 mb-5 outline-none">${opciones}</select>
 
    <button onclick="confirmSale()" class="w-full bg-[#2F9E7A] text-white font-semibold rounded-xl py-3">Registrar venta</button>
  `);
  window.__medioPago = "efectivo";
}
 
function toggleFiado(checked) {
  const wrap = document.getElementById("medio-pago-wrap");
  const clienteSelect = document.getElementById("venta-cliente");
  if (checked) {
    wrap.classList.add("screen-hidden");
    if (!clienteSelect.value) alert("Elegí un cliente para dejarlo a cuenta.");
  } else {
    wrap.classList.remove("screen-hidden");
  }
}
 
function selectPago(medio, btn) {
  window.__medioPago = medio;
  document.querySelectorAll(".pago-btn").forEach((b) => {
    b.classList.remove("bg-[#6B2D5C]", "text-white");
  });
  btn.classList.add("bg-[#6B2D5C]", "text-white");
}
 
async function confirmSale() {
  const items = Object.entries(cart).filter(([, q]) => q > 0);
  if (items.length === 0 && heladoCart.length === 0) return;
 
  const registrado_por = document.getElementById("registrado-por").value;
  const es_fiado = document.getElementById("venta-fiado").checked;
  const clienteVal = document.getElementById("venta-cliente").value;
  const cliente_id = clienteVal ? Number(clienteVal) : null;
  if (es_fiado && !cliente_id) { alert("Elegí un cliente para dejarlo a cuenta."); return; }
  const medio_pago = es_fiado ? "fiado" : (window.__medioPago || "efectivo");
 
  const calculo = calcularCarritoPromos();
  let subtotalTotal = calculo.subtotalTotal, descuentoTotal = calculo.descuentoTotal;
  const lineas = calculo.lineas.map((l) => ({
    producto_id: l.producto.id, cantidad: l.cantidad, precio_unitario: l.producto.precio_venta,
    costo_unitario: l.producto.costo_ultimo, descuento: l.descuento, subtotal: l.subtotal,
  }));
 
  // Líneas de helados armados
  heladoCart.forEach((h) => {
    const producto = productos.find((p) => p.id === h.productoId);
    const cantidad = h.tipo === "bola" ? h.bolas.length : 1;
    subtotalTotal += h.total;
    lineas.push({ producto_id: producto.id, cantidad, precio_unitario: producto.precio_venta, costo_unitario: producto.costo_ultimo, descuento: 0, subtotal: h.total });
  });
 
  const total = subtotalTotal - descuentoTotal;
 
  const { data: venta, error: ventaError } = await sb
    .from("ventas")
    .insert({ subtotal: subtotalTotal, descuento_total: descuentoTotal, total, medio_pago, registrado_por, cliente_id, es_fiado })
    .select().single();
  if (ventaError) { alert("No se pudo registrar la venta."); console.error(ventaError); return; }
 
  const itemsToInsert = lineas.map((l) => ({ ...l, venta_id: venta.id }));
  await sb.from("venta_items").insert(itemsToInsert);
 
  // Descontar stock de productos normales
  for (const [id, qty] of items) {
    const p = productos.find((pr) => pr.id === Number(id));
    await sb.from("productos").update({ stock: p.stock - qty }).eq("id", p.id);
  }
 
  // Descontar insumos de cada helado armado
  const cucharita = insumoPorNombre("Cucharita");
  const servilleta = insumoPorNombre("Servilleta");
  const cobertura = insumoPorNombre("Cobertura");
  const poteIsopor = insumoPorNombre("Pote de Isopor 1/4");
 
  for (const h of heladoCart) {
    // Descontar cada bola del balde de su sabor
    const conteoPorSabor = {};
    h.bolas.forEach((id) => (conteoPorSabor[id] = (conteoPorSabor[id] || 0) + 1));
    for (const [saborId, cant] of Object.entries(conteoPorSabor)) {
      const balde = productos.find((p) => p.id === Number(saborId));
      if (balde) await sb.from("productos").update({ stock: balde.stock - cant }).eq("id", balde.id);
    }
    // Envase
    if (h.tipo === "bola" && h.envaseId) {
      const envase = productos.find((p) => p.id === h.envaseId);
      if (envase) await sb.from("productos").update({ stock: envase.stock - 1 }).eq("id", envase.id);
    }
    if (h.tipo === "pote14" && poteIsopor) {
      await sb.from("productos").update({ stock: poteIsopor.stock - 1 }).eq("id", poteIsopor.id);
    }
    // Cucharita y servilleta (una por venta armada)
    if (cucharita) await sb.from("productos").update({ stock: cucharita.stock - 1 }).eq("id", cucharita.id);
    if (servilleta) await sb.from("productos").update({ stock: servilleta.stock - 1 }).eq("id", servilleta.id);
    // Cobertura si se eligió
    if (h.cobertura && cobertura) await sb.from("productos").update({ stock: cobertura.stock - 1 }).eq("id", cobertura.id);
  }
 
  cart = {};
  heladoCart = [];
  closeModal();
  activeTab = "dashboard";
  await loadAll();
}
 
// ---------- Edición / alta de productos ----------

  const opcionesCategoria = categorias.map((c) => `<option value="${c.id}" ${c.id===p.categoria_id?"selected":""}>${c.nombre}</option>`).join("");
  showModal(`
    <p class="font-display text-[18px] font-semibold text-[#241C2E] mb-4">Editar producto</p>
    <div class="space-y-3">
      <div>
        <label class="text-[11px] font-semibold uppercase tracking-wide text-[#8a7d94]">Nombre</label>
        <input id="edit-nombre" type="text" value="${p.nombre}" class="w-full bg-[#F7F3FA] rounded-xl px-3 py-2.5 text-[14px] mt-1 outline-none" />
      </div>
      <div>
        <label class="text-[11px] font-semibold uppercase tracking-wide text-[#8a7d94]">Categoría</label>
        <select id="edit-categoria" class="w-full bg-[#F7F3FA] rounded-xl px-3 py-2.5 text-[14px] mt-1 outline-none">${opcionesCategoria}</select>
      </div>
      <div>
        <label class="text-[11px] font-semibold uppercase tracking-wide text-[#8a7d94]">Presentación (opcional)</label>
        <input id="edit-presentacion" type="text" value="${p.presentacion || ""}" class="w-full bg-[#F7F3FA] rounded-xl px-3 py-2.5 text-[14px] mt-1 outline-none" />
      </div>
      <label class="flex items-center gap-2">
        <input type="checkbox" id="edit-es-insumo" ${p.es_insumo ? "checked" : ""} class="w-4 h-4" />
        <span class="text-[13px] text-[#241C2E]">Es un insumo (no se vende directo)</span>
      </label>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-[11px] font-semibold uppercase tracking-wide text-[#8a7d94]">Stock actual</label>
          <input id="edit-stock" type="number" value="${p.stock}" class="w-full bg-[#F7F3FA] rounded-xl px-3 py-2.5 text-[14px] mt-1 outline-none" />
        </div>
        <div>
          <label class="text-[11px] font-semibold uppercase tracking-wide text-[#8a7d94]">Stock mínimo</label>
          <input id="edit-minimo" type="number" value="${p.stock_minimo}" class="w-full bg-[#F7F3FA] rounded-xl px-3 py-2.5 text-[14px] mt-1 outline-none" />
        </div>
        <div>
          <label class="text-[11px] font-semibold uppercase tracking-wide text-[#8a7d94]">Precio de venta</label>
          <input id="edit-precio" type="number" value="${p.precio_venta}" class="w-full bg-[#F7F3FA] rounded-xl px-3 py-2.5 text-[14px] mt-1 outline-none" />
        </div>
        <div>
          <label class="text-[11px] font-semibold uppercase tracking-wide text-[#8a7d94]">Costo (último)</label>
          <input id="edit-costo" type="number" value="${p.costo_ultimo}" class="w-full bg-[#F7F3FA] rounded-xl px-3 py-2.5 text-[14px] mt-1 outline-none" />
        </div>
      </div>
    </div>
    <button onclick="saveEditProduct(${p.id})" class="w-full bg-[#6B2D5C] text-white font-semibold rounded-xl py-3 mt-5">Guardar cambios</button>
    ${p.nombre === "Hielo · Bolsa" ? `
    <div class="bg-[#F7F3FA] rounded-xl p-3 mt-3">
      <p class="text-[12px] font-semibold text-[#241C2E] mb-2">Cargar bolsitas con agua</p>
      <p class="text-[11px] text-[#8a7d94] mb-2">Convierte bolsitas vacías en hielo listo para vender.</p>
      <div class="flex items-center gap-2">
        <input id="cargar-hielo-cantidad" type="number" value="1" class="flex-1 bg-white rounded-lg px-3 py-2 text-[14px] outline-none" />
        <button onclick="cargarHielo()" class="bg-[#6B2D5C] text-white text-[12px] font-semibold px-3 py-2 rounded-lg">Cargar</button>
      </div>
    </div>` : ""}
    <button onclick="deleteProduct(${p.id})" class="w-full text-[#D64545] text-[13px] font-semibold py-3 mt-1">Eliminar producto</button>
  `);
}
 
async function cargarHielo() {
  const cantidad = Number(document.getElementById("cargar-hielo-cantidad").value) || 0;
  if (cantidad <= 0) return;
  const bolsita = productos.find((p) => p.nombre === "Bolsita de Hielo");
  const hielo = productos.find((p) => p.nombre === "Hielo · Bolsa");
  if (!bolsita || !hielo) { alert("Falta cargar 'Bolsita de Hielo' o 'Hielo · Bolsa' en productos."); return; }
  if (bolsita.stock < cantidad) { alert(`Solo quedan ${bolsita.stock} bolsitas vacías.`); return; }
  await sb.from("productos").update({ stock: bolsita.stock - cantidad }).eq("id", bolsita.id);
  await sb.from("productos").update({ stock: hielo.stock + cantidad }).eq("id", hielo.id);
  closeModal();
  await loadAll();
}
 
async function saveEditProduct(id) {
  const nombre = document.getElementById("edit-nombre").value.trim();
  const categoria_id = Number(document.getElementById("edit-categoria").value);
  const presentacion = document.getElementById("edit-presentacion").value.trim() || null;
  const es_insumo = document.getElementById("edit-es-insumo").checked;
  const stock = Number(document.getElementById("edit-stock").value);
  const stock_minimo = Number(document.getElementById("edit-minimo").value);
  const precio_venta = Number(document.getElementById("edit-precio").value);
  const costo_ultimo = Number(document.getElementById("edit-costo").value);
  const { error } = await sb.from("productos").update({ nombre, categoria_id, presentacion, es_insumo, stock, stock_minimo, precio_venta, costo_ultimo }).eq("id", id);
  if (error) { alert("No se pudo guardar."); console.error(error); return; }
  closeModal();
  await loadAll();
}
 
async function deleteProduct(id) {
  const p = productos.find((pr) => pr.id === id);
  if (p && (p.nombre === "Helado · Bola" || p.nombre === "Helado · Pote 1/4")) {
    alert("Este producto es necesario para que funcione la venta de Helados y no se puede eliminar. Si querés dejar de venderlo, poné el precio en 0 en vez de borrarlo.");
    return;
  }
  if (!confirm("¿Eliminar este producto? Ya no va a aparecer en la app, pero se conserva en el historial de ventas pasadas.")) return;
  const { error } = await sb.from("productos").update({ activo: false }).eq("id", id);
  if (error) { alert("No se pudo eliminar."); console.error(error); return; }
  closeModal();
  await loadAll();
}

  const opciones = categorias.map((c) => `<option value="${c.id}">${c.nombre}</option>`).join("");
  showModal(`
    <p class="font-display text-[18px] font-semibold text-[#241C2E] mb-4">Nuevo producto</p>
    <div class="space-y-3">
      <div>
        <label class="text-[11px] font-semibold uppercase tracking-wide text-[#8a7d94]">Nombre</label>
        <input id="new-nombre" type="text" class="w-full bg-[#F7F3FA] rounded-xl px-3 py-2.5 text-[14px] mt-1 outline-none" />
      </div>
      <div>
        <label class="text-[11px] font-semibold uppercase tracking-wide text-[#8a7d94]">Categoría</label>
        <select id="new-categoria" class="w-full bg-[#F7F3FA] rounded-xl px-3 py-2.5 text-[14px] mt-1 outline-none">${opciones}</select>
      </div>
      <div>
        <label class="text-[11px] font-semibold uppercase tracking-wide text-[#8a7d94]">Presentación (opcional)</label>
        <input id="new-presentacion" type="text" placeholder="Ej: 1.5 litros" class="w-full bg-[#F7F3FA] rounded-xl px-3 py-2.5 text-[14px] mt-1 outline-none" />
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-[11px] font-semibold uppercase tracking-wide text-[#8a7d94]">Precio venta</label>
          <input id="new-precio" type="number" class="w-full bg-[#F7F3FA] rounded-xl px-3 py-2.5 text-[14px] mt-1 outline-none" />
        </div>
        <div>
          <label class="text-[11px] font-semibold uppercase tracking-wide text-[#8a7d94]">Costo</label>
          <input id="new-costo" type="number" class="w-full bg-[#F7F3FA] rounded-xl px-3 py-2.5 text-[14px] mt-1 outline-none" />
        </div>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-[11px] font-semibold uppercase tracking-wide text-[#8a7d94]">Stock inicial</label>
          <input id="new-stock" type="number" value="0" class="w-full bg-[#F7F3FA] rounded-xl px-3 py-2.5 text-[14px] mt-1 outline-none" />
        </div>
        <div>
          <label class="text-[11px] font-semibold uppercase tracking-wide text-[#8a7d94]">Stock mínimo</label>
          <input id="new-minimo" type="number" value="5" class="w-full bg-[#F7F3FA] rounded-xl px-3 py-2.5 text-[14px] mt-1 outline-none" />
        </div>
      </div>
    </div>
    <button onclick="saveNewProduct()" class="w-full bg-[#6B2D5C] text-white font-semibold rounded-xl py-3 mt-5">Crear producto</button>
  `);
}
 
async function saveNewProduct() {
  const nombre = document.getElementById("new-nombre").value.trim();
  if (!nombre) { alert("Poné un nombre."); return; }
  const categoria_id = Number(document.getElementById("new-categoria").value);
  const presentacion = document.getElementById("new-presentacion").value.trim() || null;
  const precio_venta = Number(document.getElementById("new-precio").value) || 0;
  const costo_ultimo = Number(document.getElementById("new-costo").value) || 0;
  const stock = Number(document.getElementById("new-stock").value) || 0;
  const stock_minimo = Number(document.getElementById("new-minimo").value) || 0;
 
  const { error } = await sb.from("productos").insert({ nombre, categoria_id, presentacion, precio_venta, costo_ultimo, stock, stock_minimo });
  if (error) { alert("No se pudo crear el producto."); console.error(error); return; }
  closeModal();
  await loadAll();
}
 
// ---------- Modal genérico ----------
function showModal(html) {
  document.getElementById("modal-box").innerHTML = html;
  document.getElementById("modal-overlay").classList.remove("screen-hidden");
  document.getElementById("modal-overlay").classList.add("flex");
}
function closeModal() {
  document.getElementById("modal-overlay").classList.add("screen-hidden");
  document.getElementById("modal-overlay").classList.remove("flex");
}
document.getElementById("modal-overlay").addEventListener("click", (e) => {
  if (e.target.id === "modal-overlay") closeModal();
});
 
// ---------- Navegación ----------
document.querySelectorAll(".tab-btn").forEach((btn) => {
  btn.addEventListener("click", () => { activeTab = btn.dataset.tab; render(); });
});
document.getElementById("add-product-fab").addEventListener("click", openNewProduct);
 
checkSession();
</script>
